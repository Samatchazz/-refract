<script>
const SRC="# คลังคำถาม \"หนึ่งวันในร้านของคุณ\" — รุ่น 2 (2026-09-26)\n\nรุ่นนี้ชนกับ 100 เคสจริงจากไทย (research/05) แล้ว · 70 ข้อ 7 บท (68 ข้อให้คะแนน) · ควิซจริงใช้ 25–35 ข้อ\n\n**ที่เปลี่ยนจากรุ่น 1**\n- ทุกข้อที่มีเคสไทยรองรับ ใส่ `เคส #n` ไว้ท้ายคำถาม และดึงคำพูด/ตัวเลขจริงเข้าไปในตัวเลือก\n- เพิ่ม 25 ข้อจากเคสที่รุ่น 1 ไม่มี (มี ✚ หน้าข้อ)\n- ข้อรุ่น 1 ที่ไม่มีเคสไทยรองรับเลย ยังเก็บไว้แต่ทำเครื่องหมาย ◌ ให้พิจารณาตัด\n- เปิดโปงเพิ่มได้ 3 pain point ที่รุ่น 1 ยังไม่แตะ: A3 ค้างซัพพลายเออร์, G3 ยื้อร้านขาดทุน, D12 รูปในแอป\n\n**ป้ายท้ายตัวเลือก** [S ระบบ / I สัญชาตญาณ · P ของ / V เรื่อง · G โต / K มั่นคง · ใจดี] แล้วตามด้วย \"เผย\" = pain point · ขีด = ไม่เผย · 🏷️ = เฉพาะ segment\n\n---\n\n## บท 0 · ก่อนเริ่ม (แยกประเภทร้าน ไม่ให้คะแนน)\n\n**0.1 ร้านของคุณตอนนี้เป็นแบบไหน**\nแผงลอย/รถเข็น/ร้านในตลาด · คาเฟ่/เครื่องดื่ม · ร้านอาหารร้านเดียว · 2 สาขาขึ้นไป · ซื้อแฟรนไชส์มาเปิด · ระดับบน/โอมากาเสะ/ไฟน์ · ขายแอปอย่างเดียว · กำลังจะเปิด\n\n**0.2 เปิดมานานแค่ไหน** ยังไม่เปิด · ไม่ถึงปี · 1–3 ปี · 3–10 ปี · เกิน 10 ปี\n\n---\n\n## บท 1 · 05:30 ตลาดยังไม่สว่าง\n\n**1.1 เช้านี้จะซื้อของเข้าร้านเท่าไร คุณรู้ได้ยังไง** `เคส #3`\n- ดูของหน้าแผงแล้วค่อยตัดสินใจ อยู่มานานพอที่จะรู้ → [I] เผย A1 A10\n- มีกระดาษแผ่นเดียวที่จดไว้ทุกคืนว่าพรุ่งนี้ต้องซื้ออะไร ตามยอดที่คาดไว้ → [S] —\n- ซื้อเผื่อไว้ก่อน ของหมดกลางวันน่าอายกว่าของเหลือ → [I·ใจดี] เผย B5\n- ลูกน้องหรือซัพพลายเออร์จัดมาให้ ผมเช็กบิลทีหลัง → [S] เผย A4\n\n**1.2 หมูขึ้นจาก 100 เป็น 150 ต่อกิโล วันนี้คุณทำยังไง** `เคส #2 #5 #28`\n- ซื้อเหมือนเดิม ขายราคาเดิม สงสารลูกค้าประจำ เดี๋ยวมันก็ลง → [I·ใจดี] เผย A2 G12\n- เปลี่ยนไปใช้หมูรวมเกรดต่ำกว่า ลูกค้าไม่รู้หรอก → [I·P] เผย B2 A4 (เคส #6 ลูกค้ารู้)\n- ซื้อเหมือนเดิม แต่คืนนี้นั่งคิดว่าเมนูไหนต้องขยับ → [S] —\n- ซื้อเหมือนเดิม แล้วเอาเรื่องหมูแพงไปเล่าให้ลูกค้าฟังหน้าร้านหรือในเพจ → [V] —\n\n**1.3 ซื้อของจากเจ้าเดิมมากี่ปีแล้ว** ◌\n- เจ้าเดียวตั้งแต่เปิด เขารู้ใจ → [I·K] เผย A4\n- 2–3 เจ้าสลับ ดูราคาทุกสัปดาห์ → [S] —\n- เจอที่ถูกกว่าก็ย้าย → [I·G] เผย B2\n- ไม่รู้ ลูกน้อ
