<script>
const SRC="# คลังคำถาม \"หนึ่งวันในร้านของคุณ\" — ฉบับร่าง 1 (2026-09-26)\n\n52 ข้อ 7 บท เขียนเกินไว้ให้คัด ควิซจริงใช้ 23–25 ข้อ หรือถ้าอยากละเอียดใช้ 30–35 ก็ได้\n\n**วิธีอ่านป้ายท้ายตัวเลือก**\n- ตัวอักษรในวงเล็บ = แกนที่ให้คะแนน · **S** ระบบ / **I** สัญชาตญาณ · **P** ของ / **V** เรื่อง · **G** โต / **K** มั่นคง · **ใจดี** = ตัวปรับ\n- \"เผย\" = pain point ที่ตัวเลือกนี้เปิดโปง (รหัสอ้างอิงจาก research/03) · ขีด = ตัวเลือกนี้ไม่เผยปัญหา แค่บอกนิสัย\n- ทุกข้อพยายามให้มีตัวเลือกที่ \"ฟังดูดี\" อย่างน้อยหนึ่งอัน ที่จริงแล้วเผยปัญหา นั่นคือหัวใจของควิซ\n- ข้อที่มี 🏷️ = ใช้เฉพาะบาง segment โชว์ตามคำตอบข้อ 0\n\n---\n\n## บท 0 · ก่อนเริ่ม (แยกประเภทร้าน ไม่ให้คะแนน)\n\n**0.1 ร้านของคุณตอนนี้เป็นแบบไหน**\n- แผงลอย รถเข็น หรือร้านในตลาด → 🏷️แผง\n- คาเฟ่ หรือร้านเครื่องดื่ม → 🏷️คาเฟ่\n- ร้านอาหารร้านเดียว → 🏷️อินดี้\n- มี 2 สาขาขึ้นไป → 🏷️เชน\n- ขายผ่านแอปอย่างเดียว ไม่มีหน้าร้าน → 🏷️คลาวด์\n- กำลังจะเปิด ยังไม่มีร้าน → 🏷️ใหม่\n\n**0.2 ตอนนี้ร้านเปิดมานานแค่ไหน**\n- ยังไม่เปิด / ไม่ถึงปี · 1–3 ปี · 3–10 ปี · เกิน 10 ปี\n*(ใช้ปรับน้ำหนักบท 7 กับข้อความหน้าผล ไม่ให้คะแนน)*\n\n---\n\n## บท 1 · 05:30 ตลาดยังไม่สว่าง\n\n*ภาพ: ถนนยังมืด ไฟตลาดสว่างเป็นหย่อม เจ้าของร้านถือถุงเดินเข้าไป*\n\n**1.1 เช้านี้คุณจะซื้อของเข้าร้านเท่าไร คุณรู้ได้ยังไง**\n- ดูของหน้าแผงแล้วค่อยตัดสินใจ อยู่มานานพอที่จะรู้ว่าวันนี้ต้องใช้อะไร → [I] เผย A1 A10\n- มีกระดาษแผ่นเดียวที่จดไว้ทุกคืนว่าพรุ่งนี้ต้องซื้ออะไร ตามยอดที่คาดไว้ → [S] —\n- ซื้อเผื่อไว้ก่อน ของหมดกลางวันน่าอายกว่าของเหลือ → [I·ใจดี] เผย B5\n- ไม่ได้ไปเอง ลูกน้องหรือซัพพลายเออร์จัดมาให้ ผมเช็กบิลทีหลัง → [S] เผย A4 (ถ้าไม่เคยเทียบเจ้า)\n\n**1.2 ผักที่ใช้ประจำแพงขึ้นจากเดือนก่อนเกือบเท่าตัว วันนี้คุณทำยังไง**\n- ซื้อเหมือนเดิม ราคาขายก็เหมือนเดิม เดี๋ยวมันก็ลง → [I·ใจดี] เผย A2 G12\n- เปลี่ยนไปใช้ตัวที่ใกล้เคียง ลูกค้าไม่รู้หรอก → [I·P] เผย B2 A4\n- ซื้อเหมือนเดิม แต่กลับไปคิดว่าเมนูไหนต้องขยับราคาหรือลดปริมาณ → [S] —\n- ซื้อเหมือนเดิม แล้วเอาเรื่องผักแพงไปเล่าให้ลูกค้าฟังในเพจ → [V] —\n\n**1.3 คุณซื้อของจากเจ้าเดิมมากี่ปีแล้ว**\n- เจ้าเดียวตั้งแต่เปิดร้าน เขารู้ใจ ไม่เคยต้องเทียบ → [I·K] เผย A4\n- มี 2–3 เจ้าสลับกัน ดูราคาและของทุกสัปดาห์ → [S] —\n- เปลี่ยนบ่อย เจอที่ถูกกว่าก็ย้าย → [I·G] เผย B2 (รสแกว่งตามของ)\n- ไม่รู้ ลูกน้องเป็นคนติดต่อ → [I] เผย B10 กลับด้าน (ปล่อยแบบไม่มีระบบ) หรือ G5\n\n**1.4 ตี 5 ครึ่ง ไลน์กลุ่มพนักงานเด้ง \"วันนี้ขอลาครับ ไม่สบาย\" คนที่สองของสัปดาห์นี้**\n- ไม่เป็นไร ผมทำแทนได้ทุกตำแหน่ง → [I] เผย A5 B10 G13\n- โทรหาตัวสำรองที่มีชื่ออยู่ในลิสต์ → [S] —\n- ลดเมนูวันนี้ลง ทำเท่าที่ทำไหว → [S·K] —\n- โกรธแต่พูดอะไรไม่ได้ กลัวเขาลาออกแล้วหาคนไม่ได้ → [ใจดี] เผย A5 A6\n\n**1.5 ค่าเช่าปีหน้าขึ้นอีก 15% เจ้าของที่บอกเมื่อวาน**\n- ก็ต้องจ่าย ย้ายไม่ได้แล้ว ลูกค้าติดที่นี่ → [K] เผย A8\n- เปิดสมุดดูว่าค่าเช่ากินยอดกี่เปอร์เซ็นต์แล้ว เกิน 15 เมื่อไรต้องคิดใหม่ → [S] —\n- ต่อรอง ถ้าไม่ได้ก็หาที่ใหม่ ร้านอยู่ที่คน ไม่ได้อยู่ที่ตึก → [G] —\n- ขึ้นราคาอาหารตาม ค่าเช่าขึ้นก็ต้องขึ้น → [I] — (อาจเผย E7 ถ้าขึ้นโดยไม่มีเหตุผลที่ลูกค้าเข้าใจ)\n\n**1.6 🏷️แผง เทศกิจมาบอกว่าจุดนี้จะจัดระเบียบใหม่เดือนหน้า**\n- รอดูก่อน ที่ผ่านมาก็พูดทุกปี → [I·K] เผย A9\n- เริ่มถามลูกค้าประจำว่าถ้าย้ายไปตรงนั้นจะตามไหม → [V] —\n- หาที่สำรองไว้เลย และเริ่มให้ลูกค้าแอด LINE ไว้ตามหาร้าน → [S·G] —\n- คิดว่าถึงเวลาเช่าห้องแถวสักที → [G] — (ระวัง A7 ถ้าเลือกที่เพราะถูก)\n\n**1.7 🏷️ใหม่ คุณเลือกทำเลร้านเพราะอะไรเป็นหลัก**\n- ค่าเช่าถูก หรือเป็นที่ของครอบครัว → [I] เผย A7\n- นั่งนับคนเดินผ่านมาแล้ว 3 วัน ต่างเวลากัน → [S] —\n- ชอบบรรยากาศแถวนี้ อยากให้ร้านอยู่ตรงนี้ → [V] เผย A7 (ถ้าไม่มีข้อมูล)\n- ใกล้กลุ่มลูกค้าที่ตั้งใจขาย แม้ค่าเช่าจะแพงกว่า → [S·G] —\n\n---\n\n## บท 2 · 08:00 ครัวเริ่มมีเสียง\n\n*ภาพ: ครัวหลังร้าน กระทะเริ่มร้อน เสียงมีดสับบนเขียง*\n\n**2.1 สูตรน้ำซุป (หรือสูตรกาแฟ) ที่ทำให้ร้านนี้เป็นร้านนี้ ตอนนี้อยู่ที่ไหน**\n- อยู่ในหัวผม ทำมาสิบปีไม่เคยต้องจด → [I·P] เผย B1 G13\n- จดไว้ในสมุดเล่มหนึ่ง แต่คนอื่นอ่านแล้วทำไม่เหมือน → [I] เผย B1 B2\n- มีการ์ดสูตรติดผนัง ชั่งตวงทุกครั้ง ใครทำก็เหมือน → [S] —\n- ลูกน้องคนหนึ่งทำเป็น ผมไม่ค่อยได้ลงมือแล้ว → [I] เผย B1 (สูตรอยู่กับคนคนเดียว)\n\n**2.2 ตอนตักข้าวหรือตวงเนื้อลงจาน**\n- ตักให้เต็ม ๆ ลูกค้าจะได้ประทับใจ ร้านผมไม่งก → [I·ใจดี] เผย B4 B3\n- ใช้ทัพพีอันเดิม ตักเท่ากันทุกจาน → [S] —\n- แล้วแต่ลูกค้า ขาประจำได้เยอะหน่อย → [ใจดี] เผย B4 F4 (รั่วทางญาติ/ขาประจำ)\n- ชั่งเป็นกรัม ตั้งราคาจากตรงนั้น → [S·P] —\n\n**2.3 คุณรู้ไหมว่าจานที่ขายดีที่สุด ต้นทุนจริง ๆ จานละกี่บาท**\n- รู้คร่าว ๆ น่าจะสัก... ไม่แน่ใจ → [I] เผย B3\n- รู้ตัวเลขทุกจาน อัปเดตทุกครั้งที่ของขึ้น → [S] —\n- ไม่เคยคิด ขายได้กำไรอยู่แล้วเพราะเห็นเงินเข้าทุกวัน → [I] เผย B3 F2\n- รู้ แต่ไม่กล้าขึ้นราคาตามต้นทุนอยู่ดี → [S·ใจดี] เผย G12 A2\n\n**2.4 เมนูของร้านตอนนี้มีกี่รายการ**\n- เยอะมาก ลูกค้าอยากกินอะไรเราต้องมี → [I·ใจดี] เผย B6 C1\n- ประมาณ 15–25 รายการ ตัดทุกปี → [S] —\n- ไม่กี่อย่าง ทำอย่างเดียวให้ดีที่สุด → [P·K] —\n- เพิ่มเรื่อย ๆ ตามกระแส เมนูไหนคนพูดถึงก็ทำ → [V·G] เผย D14 B6\n\n**2.5 มีจานหนึ่งที่รู้อยู่แล้วว่าขายแล้วแทบไม่ได้กำไร แต่ยังอยู่ในเมนู เพราะ**\n- ลูกค้าประจำสั่งอยู่ ตัดไปเขาจะเสียใจ → [ใจดี·K] เผย B7\n- ผมชอบทำ มันคือจานที่ผมภูมิใจ → [I·P] เผย B7 B8\n- ไม่มี ตัดไปนานแล้ว → [S] —\n- ไม่รู้ว่าจานไหนบ้างที่ไม่ได้กำไร → [I] เผย B3 D11\n\n**2.6 ก่อนเปิดร้าน ใครเป็นคนเช็กว่าน้ำแข็งมี ถุงพร้อม เตาติด**\n- ผมเดินดูเอง ทุกวัน → [I] เผย B9 B10\n- มี checklist แปะไว้ ใครเปิดร้านต้องติ๊ก → [S] —\n- ลูกน้องรู้กันเอง ทำมานานแล้ว → [I] เผย B9\n- บางวันก็ลืม เปิดไปแล้วค่อยวิ่งซื้อ → [I] เผย B9\n\n**2.7 วัตถุดิบตัวไหนที่ร้านคุณใช้ \"ของดี\" กว่าที่ลูกค้าจะสังเกตได้**\n- หลายอย่าง ผมอยากให้ทุกจานดีที่สุด แม้ลูกค้าจะไม่รู้ → [P·ใจดี] เผย B8 (ถ้าไม่ได้บวกราคา)\n- มีตัวเดียว และผมเล่าให้ลูกค้าฟังทุกครั้งว่ามันคืออะไร → [V] —\n- ใช้ของที่ราคาสมเหตุสมผล ตัวเลขต้องคุ้มก่อน → [S·P] —\n- ไม่มี ของเราเหมือนร้านทั่วไป → [K] เผย E8\n\n**2.8 🏷️เชน วันนี้สาขา 2 โทรมาถามว่าน้ำซุปทำแบบไหน**\n- อธิบายทางโทรศัพท์ เขาเคยดูผมทำแล้ว → [I] เผย B11 B1\n- ส่งจากครัวกลางทุกเช้า ทุกสาขารสเดียวกัน → [S] —\n- ให้แต่ละสาขาปรับตามลูกค้าแถวนั้น → [I·V] เผย B11 C10 กลับด้าน\n- ผมขับไปทำเอง → [I] เผย G7 B11\n\n---\n\n## บท 3 · 12:00 คิวยาวถึงหน้าร้าน\n\n*ภาพ: โต๊ะเต็ม ลูกค้ายืนรอ พนักงานเดินสวนกัน มีเสียงแอปเดลิเวอรีดังแทรก*\n\n**3.1 ลูกค้าใหม่นั่งลงแล้วถามว่า \"แนะนำอะไรดีคะ\" คุณ (หรือพนักงาน) ตอบว่า**\n- แล้วแต่ชอบเลยครับ ของเราอร่อยทุกอย่าง → [I·ใจดี] เผย C4 G11\n- จานนี้ครับ ชี้จานเดียวไม่ต้องคิด → [P] —\n- จานนี้ค่ะ แล้วเล่าให้ฟังว่าทำไมร้านนี้ต้องเริ่มจากจานนี้ → [V] —\n- แล้วแต่วันค่ะ วันนี้อะไรสดก็แนะนำอันนั้น → [I·P] เผย C4 B2\n\n**3.2 ถ้าถามพนักงาน 3 คนว่า \"ร้านนี้เด็ดอะไร\" คุณคิดว่าจะได้คำตอบ**\n- เหมือนกันทุกคน เพราะเราซ้อมกันมา → [S·V] —\n- น่าจะต่างกัน แต่ก็ถูกทุกคน → [I] เผย C4 E9\n- ไม่แน่ใจ ไม่เคยถาม → [I] เผย C4 E9\n- พนักงานไม่ต้องรู้ ผมเป็นคนแนะนำเอง → [I·P] เผย C8 E9\n\n**3.3 คิวยาวออกไปนอกร้าน ครัวเริ่มช้า คุณทำอะไร**\n- เข้าครัวช่วยเอง เร็วกว่าอธิบาย → [I] เผย C8 C1\n- ไปหน้าร้าน บอกลูกค้าที่รอว่ารออีกกี่นาที แจกน้ำ → [V·S] —\n- ตัดเมนูที่ทำช้าออกชั่วคราว บอกพนักงานให้เชียร์ตัวที่ทำเร็ว → [S] —\n- ปล่อยไป คิวยาวคือของดี คนเห็นแล้วอยากมา → [I·V] เผย C2 C6\n\n**3.4 บิลวันนี้ 100 ใบ 60 ใบเป็นจานที่ถูกที่สุดในร้าน คุณรู้สึกว่า**\n- ดีแล้ว ขายดีคือดี → [I] เผย C5\n- ต้องดูว่าจานนั้นกำไรเท่าไร ถ้าน้อยต้องหาทางให้คนสั่งอย่างอื่นคู่ → [S] —\n- เป็นเพราะคนแถวนี้ไม่มีกำลังซื้อ → [I] เผย G10 C9\n- ปกติของร้านราคานี้ → [K] เผย C5 E7\n\n**3.5 ออร์เดอร์จากแอปเข้ามา 8 ออร์เดอร์พร้อมกัน ขณะที่หน้าร้านเต็ม**\n- ทำแอปก่อน เขารีวิวได้ ลูกค้าหน้าร้านรอได้ → [I] เผย C3 C6\n- ทำหน้าร้านก่อน คนตรงหน้าสำคัญกว่า → [I·ใจดี] เผย C3 (แอปโดนคะแนนตก)\n- มีคนแยกทำแอปโดยเฉพาะ หรือมีเวลาปิดรับแอปตอนพีค → [S] —\n- ปิดแอปไปเลยช่วงนี้ ยุ่ง → [I·K] เผย E2 กลับด้าน (ไม่คิดจะจัดการช่องทาง)\n\n**3.6 พนักงานเสิร์ฟผิดโต๊ะ ทำใหม่ทั้งจาน เกิดขึ้นบ่อยแค่ไหน**\n- ทุกวัน เป็นเรื่องปกติของร้านอาหาร → [I] เผย C7\n- นาน ๆ ที เพราะเราจดผ่านเครื่อง ไม่จดมือ → [S] —\n- บ่อย แต่ผมไม่ได้นับ → [I] เผย C7 F5\n- แทบไม่มี เพราะเมนูน้อย → [S·P] —\n\n**3.7 ลูกค้าสั่งข้าวจานเดียวแล้วไม่สั่งน้ำ พนักงานของคุณจะ**\n- ปล่อย ไม่อยากยัดเยียด → [ใจดี] เผย C9\n- ถามว่ารับน้ำอะไรดีคะ ทุกโต๊ะ ทุกครั้ง → [S] —\n- บอกว่าวันนี้มีน้ำตัวนี้ที่เข้ากับจานนี้ → [V] —\n- ไม่แน่ใจว่าพนักงานพูดอะไรบ้าง → [I] เผย C9 E9\n\n**3.8 ช่วงพีค คุณอยู่ตรงไหนของร้าน**\n- หน้าเตา ไม่มีใครทำแทนได้ → [I·P] เผย C8 B1\n- หน้าร้าน คุยกับลูกค้า ดูหน้าลูกค้าตอนกินคำแรก → [V] —\n- เดินไปมาทั้งร้าน คอยแก้ปัญหา → [I] เผย C8 (ไม่มีหัวหน้าเวร)\n- ไม่ได้อยู่ที่ร้าน ผู้จัดการดูแล → [S·G] — (ถ้ามีระบบ) / เผย G5 (ถ้าไม่มี)\n\n**3.9 🏷️ไฟน์/อินดี้ระดับบน โต๊ะจอง 6 ที่ตอนเที่ยง ไม่มา ไม่โทร**\n- เจอบ่อย ทำอะไรไม่ได้ → [K] เผย E4\n- เก็บมัดจำตั้งแต่จอง ไม่มาไม่คืน → [S] —\n- ทักไปถามและจดชื่อไว้ ครั้งหน้าไม่รับ → [S] —\n- ไม่รับจองแล้ว มาก่อนได้ก่อน → [I] เผย C2\n\n**3.10 🏷️คลาวด์ ลูกค้ารีวิวว่า \"ถึงบ้านแล้วแฉะ\" เป็นครั้งที่สามในสัปดาห์**\n- ไรเดอร์ขี่ช้า ไม่ใช่ความผิดเรา → [I] เผย C12 E3\n- ลองส่งให้ตัวเองแล้วเปิดกินตอนถึง ดูว่าเกิดอะไรขึ้น → [S] —\n- เปลี่ยนกล่อง แยกน้ำกับเส้น → [S·P] —\n- ลดราคาชดเชยให้ → [ใจดี] เผย E3 (แก้ปลายเหตุ)\n\n---\n\n## บท 4 · 14:30 ร้านเงียบ ได้ยินเสียงพัดลม\n\n*ภาพ: โต๊ะว่าง พนักงานนั่งเล่นมือถือ เจ้าของนั่งเปิดโทรศัพท์ที่โต๊ะหลังร้าน*\n\n**4.1 ตอนนี้ว่าง คุณหยิบมือถือขึ้นมาแล้วทำอะไรกับเพจร้าน**\n- ถ่ายรูปจานที่เหลือลงเพจ โพสต์ไว้ก่อน ดีกว่าเงียบ → [I·V] เผย D2\n- ดูว่าอาทิตย์นี้ต้องโพสต์อะไรตามที่วางไว้ → [S·V] —\n- ไม่ค่อยได้ทำ ของอร่อยเดี๋ยวคนก็มาเอง → [I·P] เผย D4\n- จ้างคนทำให้อยู่ แต่ไม่รู้ว่าได้ผลไหม → [I] เผย D5\n\n**4.2 มีคนคอมเมนต์ใต้โพสต์ว่า \"ร้านนี้ต่างจากร้านอื่นยังไง\" คุณตอบว่า**\n- ของเราสดกว่า อร่อยกว่า ราคาดีกว่า → [I] เผย E8 G10 G11\n- เล่าเรื่องที่มาของร้าน หรือของจานหนึ่งที่มีแค่ที่นี่ → [V] —\n- ให้มาลองเองครับ → [P] เผย E8 D4\n- ไม่ตอบ ไม่รู้จะตอบยังไง → [I] เผย G11 E8\n\n**4.3 รีวิว 1 ดาวใหม่ \"อาหารเค็มมาก บริการช้า\" คุณ**\n- ตอบว่าลูกค้าท่านอื่นชมกันทั้งนั้น คงเป็นความชอบส่วนตัว → [I·P] เผย D8 E6\n- ปล่อยไป คนเดียวไม่มีผล → [I] เผย D8\n- ตอบขอโทษ ถามว่ามาวันไหน แล้วไปเช็กในครัวว่าวันนั้นเกิดอะไร → [S] —\n- โกรธ แต่ก็ไปชิมน้ำซุปวันนี้ดู → [I·P] เผย B2 (ถ้าเค็มจริง) / — (ถ้าไปเช็ก)\n\n**4.4 ร้านตรงข้ามติดป้ายลด 20% ทั้งร้าน คนเริ่มไปฝั่งนั้น**\n- ลด 25% สู้ → [I·G] เผย D13 E7\n- ไม่ลด แต่คิดว่าจะให้ลูกค้ามีเหตุผลอะไรที่ยังมาที่นี่ → [ รจริง |\n| E2 | ยอดเกินครึ่งมาจากแอปที่คุณไม่ได้เป็นเจ้าของ วันที่เขาเปลี่ยนกฎคือวันที่คุณไม่มีทางเลือก ลูกค้าประจำควรมีทางติดต่อคุณตรง |\n| C8 | ตอนพีคคุณอยู่หน้าเตา จึงไม่มีใครเห็นว่าโต๊ะไหนรอนาน โต๊ะไหนกำลังจะเดินออก และไม่มีใครเรียนรู้ที่จะทำแทนคุณ |\n| F1 F2 | คุณรู้ว่าวันนี้ได้เท่าไรจากเงินในลิ้นชัก ซึ่งบอกยอดขาย ไม่ได้บอกกำไร ร้านจำนวนมากรู้ตัวว่าขาดทุนหลังผ่านไปหกเดือน |\n| F3 | บิลที่ถูกยกเลิก 4 ใบต่อวันที่ไม่มีใครถาม คือช่องที่เงินสดออกจากร้านได้ทุกวัน ส่วนใหญ่ไม่ใช่การโกง แต่ที่โกงก็เริ่มจากตรงนี้ |\n| F5 | คุณดูสต๊อกด้วยตา จึงไม่รู้ว่าวันนี้หมูหายไปกี่กิโล โดยเฉลี่ยร้านที่ไม่นับเสียราว 4% ของต้นทุนวัตถุดิบไปโดยไม่รู้ตัว |\n| F12 G1 | คุณบอกว่าไม่เหนื่อย เจ้าของร้านที่ทำงาน 16 ชั่วโมงทุกวันบอกแบบนี้ทุกคน จนถึงวันที่ร่างกายตัดสินใจแทน |\n| G6 G7 | คุณพร้อมเปิดสาขา 2 เพราะไปดูเองได้ทั้งสองที่ ซึ่งแปลว่าตอนนี้ยังไม่มีสาขาไหนอยู่ได้โดยไม่มีคุณ สาขาที่สองมักดึงคุณออกจากสาขาแรกจนตกทั้งคู่ |\n| G10 | คุณขายทุกคน จึงไม่มีใครรู้สึกว่าร้านนี้ทำเพื่อเขา คอนเทนต์ก็เลยพูดกับทุกคนและไม่โดนใคร |\n| G11 | ลูกค้าชมเรื่องหนึ่ง คุณโปรโมทอีกเรื่อง จุดขายของร้านคือสิ่งที่ลูกค้ากลับมาเพราะมัน ไม่ใช่สิ่งที่คุณภูมิใจที่สุด บ่อยครั้งมันคือคนละอย่างกัน |\n| G13 | คุณตอบว่าร้านคือคุณ ขายไม่ได้ ซึ่งหมายความว่าสิ่งที่คุณสร้างมาทั้งหมดมีค่าเท่ากับสุขภาพของคุณเอง |\n\n*(ที่เหลืออีก ~50 ข้อ เขียนแบบเดียวกันตอนทำหน้าผลจริง)*\n\n---\n\n## ข้อเสนอการคัด (ถ้าใช้ 25 ข้อ)\n\nบท 1: 1.1 1.2 1.4 · บท 2: 2.1 2.2 2.3 2.4 · บท 3: 3.1 3.3 3.4 3.5 · บท 4: 4.1 4.2 4.3 4.6 · บท 5: 5.1 5.3 5.4 5.5 · บท 6: 6.1 6.2 6.5 · บท 7: 7.1 7.2 7.3 7.5\n+ ข้อ 🏷️ เฉพาะ segment โผล่แทนข้อทั่วไป 2–3 ข้อตามคำตอบข้อ 0.1\n\nถ้าใช้ 35 ข้อ (ละเอียดขึ้น ยังจบใน 8–10 นาที) เพิ่ม: 1.3 2.5 2.6 3.2 3.7 4.5 4.8 5.6 6.3 6.6\n";
