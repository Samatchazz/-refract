<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>planc* — journey proto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@600;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   JOURNEY PROTO — separate from the main site on purpose.
   Same iron rules (scroll-driven, scrub-safe, B/W) with TWO
   sanctioned exceptions Mat asked to try:
   1) the rainbow — the single color moment in the whole site
   2) tapping the logo — the second input, and its bridge persists
   ============================================================ */
:root{
  --ink:#111; --paper:#fcfcfa;
  --ground-h:22dvh; --nav-h:56px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --rainbow:linear-gradient(90deg,#e5484d,#f5a524,#ffe14d,#46c56f,#3f9cf0,#8a63d2);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--paper);color:var(--ink);
     overscroll-behavior-y:none;transition:background .6s ease,color .6s ease}
h2,.brand,.logo,.cta{font-family:'Prompt','Sarabun',sans-serif}
img{display:block}

/* ---------- preloader: the bobbing cat logo ---------- */
#preload{position:fixed;inset:0;z-index:100;background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;
  transition:opacity .55s ease,visibility .55s}
#preload.gone{opacity:0;visibility:hidden;pointer-events:none}
#preload img{width:96px;animation:plbob 1.05s ease-in-out infinite;transform-origin:50% 100%}
@keyframes plbob{0%,100%{transform:scaleX(-1) translateY(0) scale(1,.96)}50%{transform:scaleX(-1) translateY(-9px) scale(.97,1.03)}}
.pl-mark{font-family:'Prompt',sans-serif;font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
.pl-mark span{display:inline-block;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pl-tag{font-size:.8rem;letter-spacing:.42em;opacity:.55;text-transform:lowercase}

/* ---------- chrome ---------- */
#nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:40;
  display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,4vw)}
#nav::after{content:'';position:absolute;left:max(18px,4vw);right:max(18px,4vw);bottom:0;height:1px;
  background:currentColor;opacity:.14}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;color:inherit;text-decoration:none;
  line-height:1;cursor:pointer;background:none;border:0;padding:.3rem .4rem;position:relative}
.badge{font-size:.6rem;letter-spacing:.3em;opacity:.45}
/* the logo goes rainbow when the story needs you */
.brand.rainbow{background-image:var(--rainbow);-webkit-background-clip:text;background-clip:text;
  color:transparent;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18) rotate(-4deg)}}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--paper);transition:background .6s ease}
.layer{position:absolute;top:0;left:0;height:100%;will-change:transform}
#lSky{z-index:1}#lMid{z-index:2}#lWorld{z-index:3}
#world{position:absolute;top:0;left:0;height:100%}
.decor{position:absolute;left:0;right:0;bottom:var(--ground-h);height:0;pointer-events:none}
.decor svg,.wd{color:var(--ink);transition:color .6s ease}
body.inverted .decor svg,body.inverted .wd{color:var(--paper)}
.decor .hill{opacity:.15}.decor .sky{opacity:.28}
.clouds{position:absolute;inset:0;pointer-events:none}
.cloud{position:absolute;opacity:.32;color:var(--ink);transition:color .6s ease;animation:drift linear infinite}
body.inverted .cloud{color:var(--paper)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-46vw)}}

.ground{position:absolute;bottom:0;height:var(--ground-h);overflow:hidden;
  color:var(--ink);transition:color .6s ease}
body.inverted .ground{color:var(--paper)}
.ground svg{display:block}

/* ---------- beats ---------- */
.beat{position:absolute;top:calc(var(--nav-h) + 7dvh);width:72vw;max-width:34rem;transition:color .6s ease}
.beat .kicker{font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;margin-bottom:.55rem;font-weight:600;opacity:.6}
.beat h2{font-size:clamp(1.5rem,6.2vw,3rem);font-weight:800;line-height:1.16}
.beat p{margin-top:.6rem;font-size:clamp(.92rem,3.4vw,1.1rem);line-height:1.6;max-width:30rem}
.rb{background-image:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.cta{display:inline-block;margin-top:1rem;padding:.75rem 1.5rem;background:var(--ink);color:var(--paper);
  text-decoration:none;font-weight:600;letter-spacing:.06em}

/* treasure labels pop out of collected items */
/* box pop-ups fly to a permanent stack at the top-right (they live in
   #stage screen space, not in the world, so the stack never scrolls) */
.tpop{position:absolute;top:0;left:0;z-index:30;white-space:nowrap;
  font-family:'Prompt',sans-serif;font-weight:800;font-size:clamp(1.05rem,4.4vw,1.6rem);
  transform-origin:0 0;transition:color .6s ease;will-change:transform,opacity;opacity:0}
.tpop.bigpop{font-size:clamp(1.7rem,7.6vw,2.9rem)}
#scrollHint{position:absolute;z-index:7;left:50%;bottom:calc(var(--ground-h) + 15dvh);
  transform:translateX(-50%);padding:.55rem 1rem;background:var(--paper);
  box-shadow:0 0 0 1px rgba(17,17,17,.16);font-size:.72rem;letter-spacing:.22em;
  white-space:nowrap;animation:hintbob 1.4s ease-in-out infinite;transition:opacity .4s}
/* piranha speech bullets */
.bullet{position:absolute;white-space:nowrap;font-family:'Prompt',sans-serif;font-weight:800;
  font-size:clamp(.95rem,3.8vw,1.4rem);padding:.2rem .55rem;border:3px solid currentColor;
  background:var(--paper);transition:background .6s ease;will-change:transform,opacity;opacity:0}
body.inverted .bullet{background:var(--ink)}

/* ---------- cat rig (simplified copy) ---------- */
#catW{position:absolute;left:24vw;bottom:calc(var(--ground-h) - 6px);
  width:clamp(104px,18vw,150px);z-index:5;will-change:transform}
#catL{transform-origin:50% 100%;will-change:transform}
#catS{transform-origin:50% 100%;will-change:transform}
#catS img{width:100%}
body.inverted #catS img{filter:drop-shadow(2px 0 0 var(--paper)) drop-shadow(-2px 0 0 var(--paper))
  drop-shadow(0 2px 0 var(--paper)) drop-shadow(0 -2px 0 var(--paper))}
#gear{position:absolute;inset:0;pointer-events:none;opacity:0}
#gear svg{position:absolute;color:var(--ink);transition:color .6s ease}
body.inverted #gear svg{color:var(--paper)}
#shadow{position:absolute;left:24vw;bottom:calc(var(--ground-h) - 10px);
  width:clamp(104px,18vw,150px);height:16px;z-index:4;pointer-events:none}
#shadow i{display:block;width:62%;height:100%;margin:0 auto;border-radius:50%;
  background:var(--ink);opacity:.18;transform-origin:50% 50%;transition:background .6s ease}

/* rainbow bridge */
#bridgeSvg{position:absolute;bottom:var(--ground-h);pointer-events:none;overflow:visible}
#bridgePath{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s var(--ease)}
body.bridged #bridgePath{stroke-dashoffset:0}

/* death flash + tap hint */
#flash{position:fixed;inset:0;background:#111;opacity:0;pointer-events:none;z-index:60}
#tapHint{position:fixed;top:calc(var(--nav-h) + 8px);left:max(18px,4vw);z-index:45;
  font-size:.78rem;letter-spacing:.12em;padding:.5rem .9rem;background:var(--paper);
  box-shadow:0 0 0 1px rgba(17,17,17,.2);opacity:0;transition:opacity .4s;pointer-events:none;
  animation:hintbob 1.3s ease-in-out infinite}
@keyframes hintbob{50%{transform:translateY(5px)}}
body.inverted #tapHint{background:var(--ink);box-shadow:0 0 0 1px rgba(252,252,250,.3)}

/* dark level swap */
body.inverted{background:var(--ink);color:var(--paper)}
body.inverted #stage{background:var(--ink)}
/* editing-desk glow — the one bright thing in the dark level */
.glow{position:absolute;bottom:var(--ground-h);width:120px;height:86px;opacity:0;transition:opacity .5s}
.glow i{position:absolute;inset:0;background:var(--paper);opacity:.92;border-radius:3px;
  box-shadow:0 0 60px 24px rgba(252,252,250,.35)}
body.inverted .glow{opacity:1}

#spacer{display:block}
#end{position:relative;z-index:35;background:var(--ink);color:var(--paper);padding:12dvh max(18px,4vw) 10dvh}
#end .in{max-width:60rem;margin:0 auto}
#end h2{font-family:'Prompt',sans-serif;font-size:clamp(1.8rem,7vw,3.2rem);font-weight:800;line-height:1.2}
#end p{margin-top:.8rem;opacity:.75}
#end .cta{background:var(--paper);color:var(--ink);margin-top:1.4rem}
</style>
</head>
<body>

<div id="preload">
  <img src="../assets/cat.png" alt="">
  <div class="pl-mark">planc<span>*</span></div>
  <div class="pl-tag">aesthetize you</div>
</div>

<header id="nav">
  <button class="brand" id="logoBtn">planc<span>*</span></button>
  <span class="badge" id="badge">JOURNEY&nbsp;PROTO</span>
</header>

<main id="stage">
  <div class="layer" id="lSky" data-f="0.12"><div class="decor" id="dHills"></div></div>
  <div class="layer" id="lMid" data-f="0.35"><div class="decor" id="dSkyline"></div><div class="clouds" id="dClouds"></div></div>
  <div class="layer" id="lWorld" data-f="1"><div id="world"></div></div>

  <div id="shadow"><i></i></div>
  <div id="catW"><div id="catL"><div id="catS">
    <img id="catImg" src="../assets/cat.png" alt="แมวดำ planc">
    <div id="gear"></div>
  </div></div></div>

  <div id="tapHint">planc* ช่วยได้ — แตะโลโก้ ↖</div>
  <div id="scrollHint">SCROLL ↓</div>
</main>

<div id="flash"></div>
<div id="spacer"></div>

<footer id="end"><div class="in">
  <p style="font-size:.68rem;letter-spacing:.34em;opacity:.5">END OF PROTO</p>
  <h2>planc<span class="rb">*</span> aesthetize you</h2>
  <p>โปรโตทดสอบ journey 4 ฉาก — ทุกอย่างยังเป็น placeholder ปรับได้ทั้งหมด</p>
  <a class="cta" href="mailto:hello@planc.studio">คุยกับเรา →</a>
</div></footer>

<script src="../js/sprites.js"></script>
<script>
(function(){
'use strict';
/* ================= scene map (progress 0..1) =================
   S1 grow   0.03–0.20  tiny cat collects 3 treasures, grows each time
   S2 life   0.24–0.46  gear piles on; dark editing zone 0.36–0.455
   S3 hits   0.50–0.68  3 piranha pipes fire word-bullets, cat shrinks
   S4 chasm  0.72–0.93  impossible gap, one death, rainbow bridge
   S5 out    0.94–1.0   aesthetize-you beat, then the closing panel  */
const S = 12500;                   // scroll px mapped to 0..1 (slower)
const NS = 'http://www.w3.org/2000/svg';
const TR = [ {p:.05,  t:'เราเป็นอินฟลู', big:true},
             {p:.105, t:'เราทำคอนเทนต์'},
             {p:.16,  t:'เรามียอดฟอล'},
             {p:.215, t:'เรามีแบรนด์จ้าง'} ];
const HIT = [ {p:.53, t:'คอนเทนต์ไม่ปัง'}, {p:.59, t:'ยอดฟอลไม่ขึ้น'}, {p:.65, t:'แบรนด์หายไป'} ];
const GAP = [.775, .905];          // the impossible chasm
const DIE = .782;                  // where the cat tries anyway
const DARK = [.36, .455];

const world = document.getElementById('world');
const stage = document.getElementById('stage');
let travel = 0, catX = 0, layers = [], grounds = [], beats = [];
let coins = [], pops = [], piranhas = [], bullets = [], glowEl, bridgeSvg, bridgePath;

const clamp01 = v => Math.min(1, Math.max(0, v));
const smooth = v => { v = clamp01(v); return v*v*(3-2*v); };
const pick = (a,i) => a[(i*31)%a.length];

function vb(id){ const p=document.getElementById(id).getAttribute('viewBox').split(/\s+/).map(Number); return {w:p[2],h:p[3]}; }
function sprite(id, cls){
  const d=vb(id), el=document.createElementNS(NS,'svg');
  el.setAttribute('viewBox','0 0 '+d.w+' '+d.h);
  if(cls) el.setAttribute('class',cls);
  const u=document.createElementNS(NS,'use'); u.setAttribute('href','#'+id);
  el.appendChild(u); el.__ar=d.w/d.h; return el;
}

/* ---- ground patterns: same Yoshi treatment as the main site ---- */
(function(){
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('width',0);svg.setAttribute('height',0);svg.style.position='absolute';
  const defs=document.createElementNS(NS,'defs');
  const top=document.createElementNS(NS,'pattern');
  top.id='gTop';top.setAttribute('patternUnits','userSpaceOnUse');
  top.setAttribute('width',360);top.setAttribute('height',42);
  top.innerHTML='<path d="M-4 15 L6 15 Q34 8 62 14 T130 13 T198 17 T266 12 Q300 16 330 14 Q348 13 364 15" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>'+
   '<path d="M-4 26 L8 26 Q48 22 88 25 T192 23 T288 27 Q330 28 364 26" fill="none" stroke="currentColor" stroke-width="2" opacity=".3"/>'+
   '<g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">'+
   '<path d="M46 13 Q43 6 38 1"/><path d="M52 13 Q54 5 58 2"/><path d="M170 15 Q167 7 163 3"/>'+
   '<path d="M177 15 Q179 6 184 2"/><path d="M292 13 Q289 6 285 2"/><path d="M298 13 Q301 7 304 3"/></g>';
  const soil=document.createElementNS(NS,'pattern');
  soil.id='gSoil';soil.setAttribute('patternUnits','userSpaceOnUse');
  soil.setAttribute('width',340);soil.setAttribute('height',180);
  soil.innerHTML='<path d="M46 62 q9 -9 24 -6 q14 3 10 11 q-4 8 -20 7 q-15 -2 -14 -12" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".24"/>'+
   '<path d="M232 122 q11 -8 25 -3 q12 4 6 11 q-7 8 -22 5 q-12 -3 -9 -13" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".22"/>'+
   '<circle cx="132" cy="146" r="3.2" fill="currentColor" opacity=".22"/><circle cx="308" cy="52" r="2.4" fill="currentColor" opacity=".2"/>'+
   '<path d="M272 38 q11 3 20 -2" fill="none" stroke="currentColor" stroke-width="2" opacity=".2"/>';
  defs.appendChild(top);defs.appendChild(soil);svg.appendChild(defs);document.body.appendChild(svg);
})();

/* ---- piranha head, drawn in code (placeholder until MJ) ---- */
function makePiranha(){
  const g=document.createElementNS(NS,'svg');
  g.setAttribute('viewBox','0 0 120 150'); g.setAttribute('class','wd piranha');
  g.innerHTML=
   '<g class="pr-root">'+
   '<path d="M60 148 L60 96" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>'+
   '<path d="M60 118 q-14 -4 -22 6 M60 106 q13 -3 20 6" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>'+
   '<g class="jawU" style="transform-origin:78px 74px">'+
     '<path d="M78 74 Q18 70 22 44 Q26 20 58 24 Q84 27 82 52 L78 74 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>'+
     '<path d="M30 52 l8 10 l8 -10 l8 10 l8 -10" fill="none" stroke="currentColor" stroke-width="3.5"/></g>'+
   '<g class="jawL" style="transform-origin:78px 78px">'+
     '<path d="M78 78 Q26 84 30 102 Q35 118 62 112 Q84 106 80 86 L78 78 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>'+
     '<path d="M40 96 l7 -8 l7 8 l7 -8 l7 8" fill="none" stroke="currentColor" stroke-width="3.5"/></g>'+
   '</g>';
  return g;
}

/* ---- gear the cat carries in scene 2 (code placeholders) ---- */
function buildGear(){
  const gear=document.getElementById('gear');
  gear.innerHTML=
   '<svg id="g1" viewBox="0 0 60 80" style="width:42%;left:8%;top:-46%"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M30 8 L12 72 M30 8 L48 72 M30 8 L30 66"/><path d="M18 46 L42 46"/></g></svg>'+
   '<svg id="g2" viewBox="0 0 70 60" style="width:40%;left:42%;top:-64%"><g fill="none" stroke="currentColor" stroke-width="5"><rect x="8" y="8" width="54" height="38" rx="8"/><path d="M35 46 L35 58 M22 58 L48 58" stroke-linecap="round"/><circle cx="35" cy="27" r="9"/></g></svg>'+
   '<svg id="g3" viewBox="0 0 60 60" style="width:34%;left:-14%;top:-30%"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"><path d="M10 22 L50 22 L44 54 L16 54 Z"/><path d="M22 22 Q22 8 30 8 Q38 8 38 22" /></g></svg>';
}

/* ================= layout ================= */
function layout(){
  catX = innerWidth*0.24;
  travel = Math.max(7000, innerWidth*4.4);
  world.style.width=(travel+innerWidth)+'px';
  document.getElementById('spacer').style.height=(S+innerHeight*2)+'px';
  layers=[...document.querySelectorAll('.layer')].map(el=>({el,f:+el.dataset.f}));
  layers.forEach(L=>L.el.style.width=(travel*L.f+innerWidth*2)+'px');

  world.replaceChildren();
  grounds=[];coins=[];pops=[];piranhas=[];bullets=[];beats=[];

  // ground: solid until the chasm, then the far bank
  [[0,GAP[0]],[GAP[1],1.02]].forEach(seg=>{
    const g=document.createElement('div'); g.className='ground';
    const a=seg[0]*travel+ (seg[0]?catX:0), b=seg[1]*travel+catX+(seg[1]>1?innerWidth:0);
    g.style.left=a+'px'; g.style.width=Math.max(0,b-a)+'px';
    g.innerHTML='<svg width="100%" height="100%" preserveAspectRatio="none">'+
      '<rect y="34" width="100%" height="100%" fill="url(#gSoil)"/>'+
      '<rect width="100%" height="42" fill="url(#gTop)"/></svg>';
    world.appendChild(g); grounds.push(g);
  });

  // beats
  const mkBeat=(p,kick,h2,body)=>{
    const s=document.createElement('section');s.className='beat';
    s.innerHTML='<div class="kicker">'+kick+'</div><h2>'+h2+'</h2>'+(body?'<p>'+body+'</p>':'');
    s.style.left=(p*travel+innerWidth*0.08)+'px';world.appendChild(s);beats.push({el:s,p});return s;
  };
  // scene 1 opens EMPTY — the box pops do the storytelling
  mkBeat(0.28,'Slice of Life','อาชีพนี้ไม่ได้มีแค่<br>ด้านที่สวย','ของที่ต้องแบก งานที่ไม่จบ คืนที่ไม่ได้นอน');
  mkBeat(0.50,'The Piranhas','แล้ววันนึง<br>มันก็กัดเรา');
  mkBeat(0.72,'The Wall','เหวที่โดดยังไง<br>ก็ไม่พ้น','บางปัญหา ตัวคนเดียวข้ามไม่ได้จริงๆ');
  const endB=mkBeat(0.945,'planc*','<span class="rb">aesthetize</span> you','ข้ามด้วยกันไหม');

  // scene 1 treasures = ? boxes head-bumped from below, like the main
  // site's block — box bottom sits exactly at the tiny cat's jump apex
  TR.forEach((t,i)=>{
    const bw=Math.min(64,Math.max(50,innerWidth*0.135));
    const tinyH=Math.min(150,Math.max(104,innerWidth*0.18))*0.34*1.15;
    const apex=Math.min(innerHeight*0.22,190)*0.62;
    const bottom=(apex+tinyH-10).toFixed(0);
    t.bw=bw; t.bottomPx=+bottom;
    const box=document.createElement('div');
    box.className='qbox';
    box.style.cssText='position:absolute;bottom:calc(var(--ground-h) + '+bottom+'px);left:'+
      (t.p*travel+catX-bw/2).toFixed(0)+'px;width:'+bw+'px;height:'+bw+'px;will-change:transform';
    const on=sprite('qblock'+(i%3+1),'wd'), off=sprite('qblock-used2','wd');
    [on,off].forEach(s=>s.style.cssText='position:absolute;inset:0;width:100%;height:100%');
    off.style.opacity=0;
    const coin=sprite('coin'+(i+1),'wd');
    coin.style.cssText='position:absolute;left:50%;top:-6%;width:58%;height:66%;transform:translate(-50%,0);opacity:0;will-change:transform,opacity';
    box.appendChild(coin);box.appendChild(on);box.appendChild(off);
    world.appendChild(box);
    coins.push({box,on,off,coin});
    const pop=document.createElement('div');pop.className='tpop'+(t.big?' bigpop':'');pop.textContent=t.t;
    stage.appendChild(pop);
    pops.push(pop); t.pw=pop.offsetWidth;   // re-measured on fonts.ready
  });

  // scene 2 props: gear built onto the cat + editing glow + moon handled by decor
  buildGear();
  glowEl=document.createElement('div');glowEl.className='glow';
  glowEl.innerHTML='<i></i>';
  glowEl.style.left=(0.41*travel+catX)+'px';
  world.appendChild(glowEl);

  // scene 3: pipes + piranhas + word bullets
  HIT.forEach((h,i)=>{
    const pipe=sprite(i%2?'pipe-short2':'pipe-short1','wd');
    const ph=innerHeight*0.13, pw=ph*pipe.__ar;
    pipe.style.cssText='position:absolute;bottom:var(--ground-h);left:'+
      (h.p*travel+catX-pw/2).toFixed(0)+'px;height:'+ph.toFixed(0)+'px;width:'+pw.toFixed(0)+'px';
    world.appendChild(pipe);
    const pr=makePiranha();
    const prH=innerHeight*0.17;
    pr.style.cssText='position:absolute;bottom:calc(var(--ground-h) + '+(ph*0.86).toFixed(0)+'px);left:'+
      (h.p*travel+catX-prH*0.4).toFixed(0)+'px;height:'+prH.toFixed(0)+'px;width:'+(prH*0.8).toFixed(0)+'px;overflow:visible';
    world.appendChild(pr);
    piranhas.push({el:pr, jawU:pr.querySelector('.jawU'), jawL:pr.querySelector('.jawL'), root:pr.querySelector('.pr-root'), p:h.p, mouthY:ph*0.86+prH*0.45});
    const b=document.createElement('div');b.className='bullet';b.textContent=h.t;
    b.style.left=(h.p*travel+catX-prH*0.5)+'px';
    b.style.bottom='calc(var(--ground-h) + '+(ph*0.86+prH*0.38).toFixed(0)+'px)';
    world.appendChild(b);bullets.push(b);
  });

  // scene 4: rainbow bridge across the gap
  bridgeSvg=document.createElementNS(NS,'svg');
  bridgeSvg.id='bridgeSvg';
  const gw=(GAP[1]-GAP[0])*travel+catX*0; const x0=GAP[0]*travel+catX-20, x1=GAP[1]*travel+catX+20;
  bridgeSvg.setAttribute('width',(x1-x0));bridgeSvg.setAttribute('height',200);
  bridgeSvg.style.left=x0+'px';bridgeSvg.style.height='200px';bridgeSvg.style.width=(x1-x0)+'px';
  bridgeSvg.innerHTML='<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">'+
   '<stop offset="0" stop-color="#e5484d"/><stop offset=".2" stop-color="#f5a524"/><stop offset=".4" stop-color="#ffe14d"/>'+
   '<stop offset=".6" stop-color="#46c56f"/><stop offset=".8" stop-color="#3f9cf0"/><stop offset="1" stop-color="#8a63d2"/></linearGradient></defs>'+
   '<path id="bridgePath" d="M6 194 Q '+((x1-x0)/2)+' 30 '+(x1-x0-6)+' 194" fill="none" stroke="url(#rg)" stroke-width="11" stroke-linecap="round" pathLength="1"/>';
  world.appendChild(bridgeSvg);
  bridgePath=bridgeSvg.querySelector('#bridgePath');

  decorate();
}

/* ---- background decor: hills / skyline / clouds / moon ---- */
function decorate(){
  const H=innerHeight;
  const dH=document.getElementById('dHills');dH.replaceChildren();
  let x=innerWidth*0.08,i=0;
  while(x<travel*0.12+innerWidth*2){
    const s=sprite(pick(['hill-s1','hill-m1','hill-s2','hill-m2'],i),'hill');
    const h=H*(0.13+((i*7)%3)*0.02);
    s.style.cssText='position:absolute;bottom:0;left:'+x.toFixed(0)+'px;height:'+h.toFixed(0)+'px;width:'+(h*s.__ar).toFixed(0)+'px';
    dH.appendChild(s);x+=h*s.__ar+260+(i*53)%240;i++;
  }
  const dS=document.getElementById('dSkyline');dS.replaceChildren();
  x=0;i=0;
  while(x<travel*0.35+innerWidth*2){
    const s=sprite(pick(['skyline1','skyline2','skyline3'],i),'sky');
    const h=H*0.19;
    s.style.cssText='position:absolute;bottom:0;left:'+x.toFixed(0)+'px;height:'+h.toFixed(0)+'px;width:'+(h*s.__ar).toFixed(0)+'px';
    dS.appendChild(s);x+=h*s.__ar-2;i++;
  }
  const dC=document.getElementById('dClouds');dC.replaceChildren();
  [[14,14,98],[58,24,72],[104,9,120],[158,29,84]].forEach((sp,j)=>{
    const s=sprite(pick(['cloud-s1','cloud-l1','cloud-s2','cloud-l2'],j),'cloud c'+(j+1));
    s.style.left=sp[0]+'vw';s.style.top=sp[1]+'dvh';s.style.width=sp[2]+'px';
    dC.appendChild(s);
  });
}

/* ================= per-frame state ================= */
const catW=document.getElementById('catW'),catL=document.getElementById('catL'),
      catS=document.getElementById('catS'),shadow=document.getElementById('shadow'),
      shadowI=shadow.firstElementChild,gear=document.getElementById('gear'),
      flash=document.getElementById('flash'),tapHint=document.getElementById('tapHint'),
      scrollHint=document.getElementById('scrollHint'),
      badge=document.getElementById('badge'),
      logo=document.getElementById('logoBtn');

let bridged=false;
logo.addEventListener('click',()=>{
  if(cur>DIE-0.01 && !bridged){ bridged=true; document.body.classList.add('bridged'); }
});

/* size: grows with each treasure, shrinks with each bite — one pure fn */
function catSize(cur){
  let s=0.34;
  TR.forEach(t=>{ s+=0.165*smooth((cur-t.p)/0.01); });   // 4 boxes -> full size
  HIT.forEach(h=>{ s-=0.22*smooth((cur-h.p)/0.008); });
  s+=0.62*smooth((cur-0.925)/0.03);   // planc got you across — grow back
  return Math.min(1,Math.max(0.30,s));
}
/* jumps: over each treasure + at each piranha + the doomed leap */
const JUMPS=()=>{
  const H=Math.min(innerHeight*0.22,190);
  const j=TR.map(t=>({p:t.p,w:.018,h:H*0.62}));
  HIT.forEach(h=>j.push({p:h.p-0.006,w:.014,h:H*0.78}));
  return j;
};
/* screen kick on every head-bump and every bite — pure fn of cur */
function impactY(cur){
  let y=0;
  TR.forEach(t=>{const k=(cur-t.p)/0.010;
    if(k>0&&k<1)y+=Math.sin(k*Math.PI*2.5)*(1-k)*9;});
  HIT.forEach(h=>{const k=(cur-h.p)/0.008;
    if(k>0&&k<1)y+=Math.sin(k*Math.PI*2.5)*(1-k)*6;});
  return y;
}
function jumpY(cur,jumps){
  let jy=0;
  for(const j of jumps){
    const t=(cur-j.p)/j.w;
    if(t>-1&&t<1){
      const rising=t<0?-t:0, falling=t>0?t:0;
      jy-=j.h*Math.max(0,1-Math.pow(rising,3)-Math.pow(Math.min(1,falling*1.18),2.1));
    }
  }
  return jy;
}
/* the doomed leap + respawn blink, all progress-driven */
function death(cur){
  let fallY=0, flashO=0, blink=1;
  if(cur>DIE&&cur<DIE+0.012){
    const k=(cur-DIE)/0.012;
    fallY = -140*Math.sin(Math.min(1,k*1.6)*Math.PI) + 560*Math.pow(Math.max(0,k-0.35)/0.65,2);
  }
  if(cur>DIE+0.008&&cur<DIE+0.022) flashO = Math.sin(clamp01((cur-DIE-0.008)/0.014)*Math.PI)*0.92;
  if(cur>DIE+0.016&&cur<DIE+0.034) blink = (Math.floor(cur*1400)%2)?0.15:1;
  return {fallY,flashO,blink};
}

let cur=0,last=0,prevT=performance.now(),phase=0,v=0;
const jumps=JUMPS();

function frame(now){
  const dt=Math.min(3,Math.max(.2,(now-prevT)/16.667));prevT=now;
  const target=clamp01(scrollY/S);
  cur+=(target-cur)*(1-Math.pow(1-0.10,dt));
  if(Math.abs(target-cur)<0.0002)cur=target;
  const d=cur-last;

  const imp=impactY(cur);
  for(const L of layers)
    L.el.style.transform='translate3d('+(-cur*travel*L.f).toFixed(2)+'px,'+imp.toFixed(2)+'px,0)';
  for(const b of beats){
    const h=Math.min(0.10,Math.max(0,cur-b.p));
    b.el.style.transform=h?'translate3d('+(h*travel).toFixed(1)+'px,0,0)':'';
  }

  // gait
  const spd=Math.min(1,Math.abs(d)/Math.max(dt,.0001)*1500);
  v+=(spd-v)*(1-Math.pow(1-0.18,dt));
  phase+=0.46*v*(d>=0?1:-1)*dt;
  const step=Math.abs(Math.sin(phase));

  const size=catSize(cur);
  const jy=jumpY(cur,jumps);
  const {fallY,flashO,blink}=death(cur);
  const air=jy<-2;
  const bob=air?0:-step*10*v*size;

  // bridge arc lift while crossing (only exists once bridged)
  let lift=0;
  if(bridged&&cur>GAP[0]&&cur<GAP[1]){
    const k=(cur-GAP[0])/(GAP[1]-GAP[0]);
    lift=2*k*(1-k)*164;   // matches the bridge's quadratic arc exactly
  }

  catW.style.transform='translate3d(0,'+(jy+bob+fallY-lift).toFixed(2)+'px,0)';
  catL.style.transform='rotate('+(Math.sin(phase*2)*2.2*v).toFixed(2)+'deg)';
  const sq=air?1.06:1-(0.085*(1-step))*v;
  catS.style.transform='scale('+(-size*(2-sq)).toFixed(3)+','+(size*sq).toFixed(3)+')';
  catS.style.opacity=blink;
  shadow.style.transform='translate3d(0,'+(-lift).toFixed(1)+'px,0) scale('+size+','+size+')';
  shadowI.style.opacity=(cur>GAP[0]&&cur<GAP[1]&&!bridged)?0:0.18*(1-Math.min(1,-jy/150)*0.7);
  flash.style.opacity=flashO;

  // scene 2: gear appears piece by piece
  gear.style.opacity=clamp01((cur-0.265)/0.01)-clamp01((cur-0.475)/0.01);
  ['g1','g2','g3'].forEach((id,i)=>{
    const g=document.getElementById(id);
    if(g)g.style.opacity=clamp01((cur-(0.275+i*0.032))/0.008);
  });
  scrollHint.style.opacity=cur<0.012?1:0;
  // the achievement stack REPLACES the corner badge
  badge.style.opacity=(1-smooth(clamp01((cur-TR[0].p-0.03)/0.02))).toFixed(2);
  document.body.classList.toggle('inverted',cur>DARK[0]&&cur<DARK[1]);

  // scene 1: ? box head-bumps — box jolts, face swaps, coin launches,
  // the label SLAMS up with an overshoot and stands for a long beat
  TR.forEach((t,i)=>{
    const c=coins[i];
    const bt=(cur-t.p)/0.02;
    const bump=(bt>0&&bt<1)?Math.sin(Math.min(bt/0.4,1)*Math.PI)*15:0;
    c.box.style.transform='translateY('+(-bump).toFixed(1)+'px)';
    c.on.style.opacity=bt>0.1?0:1;
    c.off.style.opacity=bt>0.1?1:0;
    if(bt>0.05&&bt<2.4){
      const ct=(bt-0.05)/2.35;
      const rise=1-Math.pow(1-Math.min(ct/0.4,1),2);
      const fall=Math.pow(Math.max(0,(ct-0.4)/0.6),2);
      const y=-(rise*105-fall*60);
      const spin=[1,.5,.12,.5][((cur*travel)/70|0)%4];
      c.coin.style.transform='translate(-50%,'+y.toFixed(1)+'px) scaleX('+spin+')';
      c.coin.style.opacity=ct<0.7?1:Math.max(0,1-(ct-0.7)/0.3);
    } else c.coin.style.opacity=0;
    // label: crashes out of the box, then FLIES to its permanent slot
    // at the top-right and stays — scrub back and it dives home again
    const el=pops[i];
    const pk=(cur-t.p-0.002)/0.012;
    if(pk<=0){ el.style.opacity=0; }
    else {
      el.style.opacity=1;
      const groundH=innerHeight*0.22;
      const boxTopY=innerHeight-(groundH+t.bottomPx+t.bw);
      const rise=smooth(Math.min(1,pk));
      const os=1+Math.sin(Math.min(1,pk)*Math.PI)*0.22;
      const endScale=t.big?0.40:0.58;
      const slotX=innerWidth-14-t.pw*endScale;
      const slotY=62+i*22;
      const fly=smooth(clamp01((cur-t.p-0.026)/0.032));
      // start point is fixed in SCREEN space (where it popped, above
      // the cat) — the world slides on underneath while it lingers
      const sx=catX+t.bw*0.2-t.pw/2, sy=boxTopY-16-rise*46;
      const x=sx+(slotX-sx)*fly, y=sy+(slotY-sy)*fly;
      const sc=(rise*os)*(1-fly)+endScale*fly;
      el.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0) scale('+sc.toFixed(3)+')';
    }
  });

  // scene 3: jaws snap + bullets fly at the cat
  piranhas.forEach((pr,i)=>{
    const near=Math.exp(-Math.pow((cur-(pr.p-0.012))/0.012,2));   // opens as the cat comes
    const snap=Math.exp(-Math.pow((cur-(pr.p-0.001))/0.004,2));   // snaps shut right at the bite
    const open=Math.max(0,near-snap*1.1);
    pr.jawU.style.transform='rotate('+(-open*22).toFixed(1)+'deg)';
    pr.jawL.style.transform='rotate('+(open*16).toFixed(1)+'deg)';
    const rise=smooth((cur-(pr.p-0.035))/0.012)-smooth((cur-(pr.p+0.02))/0.015);
    pr.root.style.transform='translateY('+((1-rise)*46).toFixed(1)+'px)';
    const bk=(cur-(pr.p-0.018))/0.016;                            // bullet flight 0..1
    const bo=clamp01(bk)-clamp01((bk-1.15)/0.4);
    bullets[i].style.opacity=bo.toFixed(2);
    bullets[i].style.transform='translateX('+(-smooth(clamp01(bk))*innerWidth*0.42).toFixed(0)+'px)';
  });

  // scene 4: rainbow call
  const needHelp=cur>DIE+0.03&&cur<GAP[1]&&!bridged;
  logo.classList.toggle('rainbow',needHelp||bridged&&cur<GAP[1]+0.02);
  tapHint.style.opacity=needHelp?1:0;
  if(!bridged&&cur>DIE+0.06){ bridged=true;document.body.classList.add('bridged'); } // fallback: never strand the reader

  last=cur;
  requestAnimationFrame(frame);
}

layout();
addEventListener('resize',layout);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout); // re-measure label widths with the real font
requestAnimationFrame(frame);
setTimeout(()=>document.getElementById('preload').classList.add('gone'),1600);
})();
</script>
