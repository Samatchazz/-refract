<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>fireworks lab</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111;color:#fcfcfa;font-family:'Sarabun',sans-serif}
.grid{display:grid;grid-template-columns:150px repeat(3,1fr);gap:0;padding:12px}
.lbl{display:flex;flex-direction:column;justify-content:center;padding:10px 14px;font-family:'Prompt';font-weight:600;font-size:20px;line-height:1.3}
.lbl small{font-family:'Sarabun';font-weight:400;font-size:13px;opacity:.7;margin-top:4px;line-height:1.5}
.cell{position:relative;height:210px;border:1px solid rgba(252,252,250,.08)}
.cell svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hd{padding:6px 14px;font-family:'Prompt';font-size:12px;letter-spacing:.2em;opacity:.5}
path,circle,line{stroke-linecap:round;stroke-linejoin:round}
.ground{position:absolute;left:0;right:0;bottom:22px;height:0;border-top:2.5px solid #fcfcfa;opacity:.9}
</style></head><body>
<div class="grid" id="g">
  <div class="hd"></div><div class="hd">ยิงขึ้น (k .15)</div><div class="hd">แตก (k .45)</div><div class="hd">ร่วง/จาง (k .8)</div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const RB=['#e5484d','#f5a524','#ffe14d','#46c56f','#3f9cf0','#8a63d2'];
const c01=x=>Math.max(0,Math.min(1,x));
const sm=x=>{x=c01(x);return x*x*(3-2*x)};
function seeded(i){let s=i*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e}

/* every style: k<.3 = rising dotted trail from the ground, then the break */
function trail(svg,cx,cy,k,col){
  const gy=188; const kr=c01(k/0.3);
  if(kr>=1)return;
  const y=gy-(gy-cy)*sm(kr);
  // dotted rocket trail, wobbling like a kid drew it
  for(let i=0;i<9;i++){
    const t=i/8, yy=gy-(gy-y)*t; if(yy<y)continue;
    svg.appendChild(el('circle',{cx:cx+Math.sin(t*9)*3,cy:yy,r:1.6+t*1.2,fill:col,opacity:(.25+.6*t).toFixed(2)}));
  }
  svg.appendChild(el('circle',{cx,cy:y,r:3.6,fill:'#fcfcfa'}));
}
function styleA(svg,cx,cy,k,col,seed){          // peony ดินสอสี: rays start off-centre, uneven, dot at the tip
  const r=seeded(seed); trail(svg,cx,cy,k,col); if(k<0.3)return; const b=c01((k-0.3)/0.7);
  const R=70; const n=16;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+r()*0.3, L=R*(0.6+r()*0.5)*Math.min(1,b*1.6), g=14+r()*10;
    const x0=cx+Math.cos(a)*g, y0=cy+Math.sin(a)*g, x1=cx+Math.cos(a)*(g+L), y1=cy+Math.sin(a)*(g+L)+b*b*22;
    const mx=(x0+x1)/2+Math.cos(a+1.57)*(r()*8-4), my=(y0+y1)/2+Math.sin(a+1.57)*(r()*8-4);
    const o=b<0.65?1:(1-b)/0.35;
    svg.appendChild(el('path',{d:`M${x0} ${y0} Q${mx} ${my} ${x1} ${y1}`,fill:'none',stroke:col,'stroke-width':3.4,opacity:o.toFixed(2)}));
    if(b>0.35)svg.appendChild(el('circle',{cx:x1+Math.cos(a)*5,cy:y1+Math.sin(a)*5,r:2.8,fill:col,opacity:(o*Math.min(1,(b-0.35)/0.2)).toFixed(2)}));
  }
  // a few loose sparks the kid added afterwards
  for(let i=0;i<7;i++){const a=r()*6.28,d=R*(1.15+r()*0.35)*Math.min(1,b*1.4);
    svg.appendChild(el('circle',{cx:cx+Math.cos(a)*d,cy:cy+Math.sin(a)*d+b*b*30,r:1.8,fill:col,opacity:(b<0.7?0.9:(1-b)/0.3*0.9).toFixed(2)}));}
}
function styleB(svg,cx,cy,k,col,seed){          // chrysanthemum: trails from the centre that droop under gravity
  const r=seeded(seed); trail(svg,cx,cy,k,col); if(k<0.3)return; const b=c01((k-0.3)/0.7);
  const n=22,R=78;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+r()*0.25, L=R*(0.75+r()*0.35);
    const pts=[];
    for(let j=0;j<=6;j++){const t=j/6*Math.min(1,b*1.5);pts.push([cx+Math.cos(a)*L*t, cy+Math.sin(a)*L*t+ (t*t)*(38+r()*10)*b]);}
    const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
    const o=b<0.6?1:(1-b)/0.4;
    svg.appendChild(el('path',{d,fill:'none',stroke:col,'stroke-width':2.6,opacity:o.toFixed(2),'stroke-dasharray':'6 4'}));
    const p=pts[pts.length-1];
    svg.appendChild(el('circle',{cx:p[0],cy:p[1],r:2.6,fill:'#fcfcfa',opacity:o.toFixed(2)}));
  }
}
function styleC(svg,cx,cy,k,col,seed){          // willow: long soft arcs falling, gold-ish, sparse
  const r=seeded(seed); trail(svg,cx,cy,k,col); if(k<0.3)return; const b=c01((k-0.3)/0.7);
  const n=12,R=95;
  for(let i=0;i<n;i++){
    const a=-Math.PI*0.95+i/(n-1)*Math.PI*0.9+r()*0.15;   // fan upward, then fall
    const L=R*(0.7+r()*0.4)*Math.min(1,b*1.25), drop=(60+r()*50)*b*b;
    const x1=cx+Math.cos(a)*L, y1=cy+Math.sin(a)*L+drop;
    const cx1=cx+Math.cos(a)*L*0.8, cy1=cy+Math.sin(a)*L*0.8;
    const o=b<0.5?1:(1-b)/0.5;
    svg.appendChild(el('path',{d:`M${cx} ${cy} Q${cx1} ${cy1} ${x1} ${y1}`,fill:'none',stroke:col,'stroke-width':2.2,opacity:(o*.9).toFixed(2)}));
    for(let j=1;j<=3;j++){const t=1+j*0.08;svg.appendChild(el('circle',{cx:x1+(x1-cx1)*0.1*j,cy:y1+drop*0.1*j*t,r:1.4,fill:col,opacity:(o*0.6/j).toFixed(2)}));}
  }
}
function styleD(svg,cx,cy,k,col,seed){          // crossette / Mario: a ring of dots, then each dot splits into 3 sparks
  const r=seeded(seed); trail(svg,cx,cy,k,col); if(k<0.3)return; const b=c01((k-0.3)/0.7);
  const n=8,R=44*Math.min(1,b*1.8);
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2+0.39, x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R+b*b*16;
    const o=b<0.5?1:(1-b)/0.5;
    svg.appendChild(el('circle',{cx:x,cy:y,r:4.2,fill:col,opacity:o.toFixed(2)}));
    if(b>0.4){const s=c01((b-0.4)/0.4);
      for(let j=0;j<3;j++){const aa=a+(j-1)*0.6, L=22*s;
        svg.appendChild(el('line',{x1:x,y1:y,x2:x+Math.cos(aa)*L,y2:y+Math.sin(aa)*L+s*s*8,stroke:col,'stroke-width':2.4,opacity:(o*.9).toFixed(2)}));
        svg.appendChild(el('circle',{cx:x+Math.cos(aa)*L,cy:y+Math.sin(aa)*L+s*s*8,r:1.8,fill:'#fcfcfa',opacity:(o*s).toFixed(2)}));}}
  }
  // the wobbly outline ring a kid draws around the bang
  if(b>0.15&&b<0.75){const o=Math.sin((b-0.15)/0.6*Math.PI);
    let d='M';for(let j=0;j<=24;j++){const a=j/24*6.283,rr=R*1.5+Math.sin(j*2.3)*4;d+=(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1)+(j<24?' L':'');}
    svg.appendChild(el('path',{d,fill:'none',stroke:'#fcfcfa','stroke-width':1.6,opacity:(o*.5).toFixed(2),'stroke-dasharray':'3 6'}));}
}
const ROWS=[
  ['ก. Peony ดินสอสี',styleA,'เส้นเริ่มห่างจากใจกลาง ยาวไม่เท่ากัน ปลายมีจุด + ประกายลอย ๆ รอบนอก แบบเด็กวาดจริง'],
  ['ข. Chrysanthemum หางร่วง',styleB,'เส้นประพุ่งจากใจกลางแล้วโค้งตกตามแรงโน้มถ่วง ปลายเป็นดาวขาว'],
  ['ค. Willow ต้นหลิว',styleC,'โค้งยาวห้อยลงเบา ๆ เส้นบางกว่า จำนวนน้อย นุ่มที่สุด'],
  ['ง. Crossette / Mario',styleD,'วงจุด 8 จุดแบบพลุท้ายด่าน Mario แล้วแต่ละจุดแตกเป็น 3 ประกาย มีวงยึกยือรอบ'],
];
const g=document.getElementById('g');
ROWS.forEach(([name,fn,desc],ri)=>{
  const l=document.createElement('div');l.className='lbl';l.innerHTML=name+'<small>'+desc+'</small>';g.appendChild(l);
  [0.15,0.45,0.8].forEach((k,ci)=>{
    const c=document.createElement('div');c.className='cell';
    const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 340 210');
    // two bursts per cell so the overlap/colour mix shows too
    fn(svg,120,80,k,RB[(ri*2)%6],ri*7+1);
    fn(svg,235,105,c01(k-0.12),RB[(ri*2+3)%6],ri*7+4);
    c.appendChild(svg);const gr=document.createElement('div');gr.className='ground';c.appendChild(gr);g.appendChild(c);
  });
});
</script></body></html>
