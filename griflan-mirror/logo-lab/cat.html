<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Plan C — Cat Mascot Lab</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0f1613; --ivory:#f2efde; --gold:#f0b32e;
    /* coat variables — swapped by variant */
    --coat:#f2efde; --coat2:#f2efde; --eye:#0f1613; --pupil:#f2efde;
  }
  body { background:var(--bg); color:var(--ivory); font-family:sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px 16px; }
  h1 { font-size:18px; color:var(--gold); margin-bottom:4px; }
  p.hint { font-size:12.5px; color:rgba(242,239,222,.55); margin-bottom:22px; text-align:center; }

  .stage { width:min(680px,94vw); aspect-ratio:9/5; position:relative; border:1px dashed rgba(242,239,222,.18);
    border-radius:12px; overflow:hidden; }
  .cat-wrap { position:absolute; inset:0; display:grid; place-items:center;
    transform:translateY(-110%); transition:transform 1.1s cubic-bezier(.34,1.4,.4,1); }
  .cat-wrap.entered { transform:translateY(0); }
  svg { width:86%; height:auto; overflow:visible; }

  /* ---- idle breathing ---- */
  .body-grp { animation:breathe 4s ease-in-out infinite; transform-origin:50% 100%; }
  @keyframes breathe { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.018)} }

  /* ---- tail: idle sway + states (rotation = ไม่มีวันกลับด้าน) ---- */
  .tail-grp { transform-origin: 618px 330px; animation:sway 4s ease-in-out infinite; transition:transform .5s cubic-bezier(.34,1.5,.5,1); }
  @keyframes sway { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-4deg)} }
  .cat.alert .tail-grp { animation:none; transform:rotate(-14deg); }
  .cat.flick .tail-grp { animation:flick .55s cubic-bezier(.3,1.6,.4,1); }
  @keyframes flick { 0%{transform:rotate(0)} 35%{transform:rotate(-32deg)} 70%{transform:rotate(6deg)} 100%{transform:rotate(0)} }

  /* ---- ears ---- */
  .ear-l, .ear-r { transform-origin:50% 100%; transition:transform .3s cubic-bezier(.34,1.6,.5,1); }
  .cat.alert .ear-l { transform:rotate(-6deg) scaleY(1.18); }
  .cat.alert .ear-r { transform:rotate(6deg) scaleY(1.18); }
  .cat .ear-l.twitch { animation:twitch .3s ease; }
  @keyframes twitch { 0%{transform:rotate(0)} 40%{transform:rotate(-24deg)} 100%{transform:rotate(0)} }

  /* ---- eyes / blink / sleep ---- */
  .eye-grp { transition:transform .3s; }
  .cat.alert .eye-grp { transform:scale(1.12); transform-origin:center; }
  .lid { transform:scaleY(0); transform-origin:50% 50%; transition:transform .09s ease-in; }
  .cat.blink .lid, .cat.sleep .lid { transform:scaleY(1); }
  .pupil { transition:transform .12s ease-out; }
  .cat.sleep .body-grp { animation-duration:6s; }

  /* ---- zzz ---- */
  .zzz text { opacity:0; fill:var(--ivory); font-family:Georgia,serif; font-weight:bold; }
  .cat.sleep ~ .zzz text, .zzz.on text { animation:zfloat 3s linear infinite; }
  .zzz text:nth-child(2){ animation-delay:1s !important; }
  .zzz text:nth-child(3){ animation-delay:2s !important; }
  @keyframes zfloat { 0%{opacity:0; transform:translate(0,0)} 20%{opacity:.85}
    80%{opacity:0; transform:translate(26px,-56px)} 100%{opacity:0} }

  /* ---- click squash ---- */
  .cat.squash { animation:squash .45s cubic-bezier(.3,1.6,.4,1); transform-origin:50% 100%; }
  @keyframes squash { 0%{transform:scaleY(1)} 30%{transform:scaleY(.92) scaleX(1.03)} 65%{transform:scaleY(1.04)} 100%{transform:scaleY(1)} }

  /* ---- egg: coat wave ---- */
  .wave { transform:translateX(-115%); }
  .cat.egging .wave { animation:wavesweep .8s cubic-bezier(.5,0,.3,1) forwards; }
  @keyframes wavesweep { to { transform:translateX(115%);} }

  /* ---- controls ---- */
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:20px; }
  button { background:transparent; border:1px solid rgba(240,179,46,.55); color:var(--gold);
    border-radius:99px; padding:7px 16px; font-size:13px; cursor:pointer; }
  button:hover { background:var(--gold); color:var(--bg); }
  .note { margin-top:14px; font-size:11.5px; color:rgba(242,239,222,.45); }
</style>
</head>
<body>
<h1>Plan C — Cat Mascot (SVG จากโลโก้, ทุกแอคเป็นโค้ด)</h1>
<p class="hint">ขยับเมาส์ = ตากลอกตาม · ปุ่มด้านล่างยิงทุกแอค · หางหมุนรอบจุดยึด — กลับด้านไม่ได้แน่นอน</p>

<div class="stage" id="stage">
  <div class="cat-wrap" id="wrap">
    <svg viewBox="0 0 900 500" id="catsvg">
      <g class="cat" id="cat">
        <!-- ═══ TAIL (reversed C, opening LEFT — วาดครั้งเดียว ขยับด้วย rotate เท่านั้น) ═══ -->
        <g class="tail-grp" id="tailGrp">
          <path fill="var(--coat)" d="M618 330
            C 600 210, 700 130, 790 170
            C 880 210, 890 340, 800 390
            C 760 412, 712 408, 686 384
            L 714 340
            C 736 358, 768 356, 788 332
            C 820 292, 800 226, 754 214
            C 700 200, 656 250, 668 318 Z"/>
        </g>

        <!-- ═══ BODY = "lan" mass (เงาตัวอักษรแบบ silhouette + ร่องขา) ═══ -->
        <g class="body-grp" id="bodyGrp">
          <path fill="var(--coat)" d="M262 430
            C 262 380, 268 330, 300 300
            C 330 272, 380 268, 420 282
            C 470 250, 540 252, 580 290
            C 612 318, 630 370, 632 430 Z"/>
          <!-- ร่องขา (สี bg) -->
          <rect x="380" y="340" width="12" height="90" rx="6" fill="var(--bg)"/>
          <rect x="490" y="330" width="12" height="100" rx="6" fill="var(--bg)"/>
          <!-- อุ้งเท้าหน้า -->
          <ellipse cx="330" cy="424" rx="34" ry="14" fill="var(--coat)"/>
        </g>

        <!-- ═══ HEAD (P) ═══ -->
        <g class="head-grp" id="headGrp">
          <!-- หู 2 ข้าง -->
          <path class="ear-l" id="earL" fill="var(--coat)" d="M118 118 L118 46 L172 100 Z"/>
          <path class="ear-r" fill="var(--coat)" d="M262 118 L262 46 L208 100 Z"/>
          <!-- หัวทรงตัว P -->
          <path fill="var(--coat)" d="M112 108
            C 112 96, 120 88, 132 88
            L 248 88
            C 260 88, 268 96, 268 108
            L 268 430 L 112 430 Z"/>
          <!-- โหว่ bowl ของ P (สี bg) -->
          <path fill="var(--bg)" d="M268 300 C 232 300, 210 330, 210 366 C 210 402, 232 430, 268 430 Z"/>
          <!-- ตา -->
          <g class="eye-grp" id="eyeGrp">
            <ellipse cx="163" cy="170" rx="17" ry="26" fill="var(--pupil)"/>
            <ellipse cx="222" cy="170" rx="17" ry="26" fill="var(--pupil)"/>
            <circle class="pupil" id="pupL" cx="163" cy="176" r="8" fill="var(--eye)"/>
            <circle class="pupil" id="pupR" cx="222" cy="176" r="8" fill="var(--eye)"/>
            <!-- เปลือกตา (สี coat ปิดทับตอนกะพริบ/หลับ) -->
            <rect class="lid" x="138" y="140" width="50" height="60" fill="var(--coat)"/>
            <rect class="lid" x="197" y="140" width="50" height="60" fill="var(--coat)"/>
            <!-- เส้นตาหลับ -->
            <g class="lid" style="transition-delay:.05s">
              <path d="M148 172 Q163 182 178 172" stroke="var(--eye)" stroke-width="4" fill="none" stroke-linecap="round"/>
              <path d="M207 172 Q222 182 237 172" stroke="var(--eye)" stroke-width="4" fill="none" stroke-linecap="round"/>
            </g>
          </g>
        </g>

        <!-- egg wave overlay -->
        <g clip-path="url(#catclip)">
          <rect class="wave" x="60" y="20" width="880" height="460" fill="var(--gold)" opacity=".28"/>
        </g>
      </g>

      <!-- zzz -->
      <g class="zzz" id="zzz">
        <text x="300" y="80" font-size="26">z</text>
        <text x="330" y="60" font-size="36">z</text>
        <text x="368" y="38" font-size="48">z</text>
      </g>
    </svg>
  </div>
</div>

<div class="row">
  <button onclick="catAPI.begin()">begin() เข้าฉาก</button>
  <button onmouseenter="catAPI.hover(true)" onmouseleave="catAPI.hover(false)">hover (ชี้ค้าง)</button>
  <button onclick="catAPI.click()">click() สะบัดหาง</button>
  <button onclick="catAPI.egg()">egg() เปลี่ยนสีขน</button>
  <button onclick="catAPI.sleep()">sleep สลับหลับ/ตื่น</button>
</div>
<p class="note">โครงร่างเป็น v1 วาดจากสัดส่วนโลโก้ — จูนทรงให้เป๊ะขึ้นได้เรื่อยๆ / สี 5 แบบ: งาช้าง·ดำ·ส้ม·วิเชียรมาศ·เทา</p>

<script>
(() => {
  const cat = document.getElementById('cat');
  const wrap = document.getElementById('wrap');
  const zzz = document.getElementById('zzz');
  const pupL = document.getElementById('pupL'), pupR = document.getElementById('pupR');
  const root = document.documentElement;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* coat variants */
  const coats = [
    { name:'ivory',  coat:'#f2efde', eye:'#0f1613', pupil:'#0f1613', eyeball:'#f2efde' },
    { name:'black',  coat:'#151312', eye:'#f2efde', pupil:'#f2efde', eyeball:'#f2efde' },
    { name:'orange', coat:'#e8923a', eye:'#3a2410', pupil:'#3a2410', eyeball:'#f7ecd8' },
    { name:'siamese',coat:'#e8d9bc', eye:'#4a3320', pupil:'#4a3320', eyeball:'#fdf6e8' },
    { name:'korat',  coat:'#8b93a1', eye:'#1c2128', pupil:'#1c2128', eyeball:'#eef1f5' },
  ];
  let ci = 0;
  function applyCoat(i) {
    const c = coats[i % coats.length];
    root.style.setProperty('--coat', c.coat);
    root.style.setProperty('--eye', c.eye);
    root.style.setProperty('--pupil', c.eyeball);
    document.querySelectorAll('.pupil').forEach(p => p.setAttribute('fill', c.pupil));
  }

  /* eye tracking (normalized to window center, eased) */
  let tx = 0, ty = 0, cx = 0, cy = 0;
  addEventListener('mousemove', e => {
    tx = (e.clientX / innerWidth - 0.5) * 2;
    ty = (e.clientY / innerHeight - 0.5) * 2;
    wake();
  });
  (function loop() {
    cx += (tx - cx) * 0.08; cy += (ty - cy) * 0.08;   // ease/lag
    const dx = cx * 7, dy = cy * 9;
    pupL.setAttribute('transform', `translate(${dx} ${dy})`);
    pupR.setAttribute('transform', `translate(${dx} ${dy})`);
    const head = document.getElementById('headGrp');
    head.style.transform = `rotate(${cx * 2.5}deg)`;   // head tilt ตามช้ากว่า
    head.style.transformOrigin = '190px 430px';
    requestAnimationFrame(loop);
  })();

  /* blink สุ่ม */
  function blink() {
    cat.classList.add('blink');
    setTimeout(() => cat.classList.remove('blink'), 130);
    schedBlink();
  }
  function schedBlink() { if (!sleeping) setTimeout(blink, 2800 + Math.random() * 3800); }

  /* ear twitch สุ่ม */
  setInterval(() => {
    if (sleeping) return;
    const ear = document.getElementById('earL');
    ear.classList.add('twitch');
    setTimeout(() => ear.classList.remove('twitch'), 350);
  }, 5200);

  /* sleep */
  let sleeping = false, idleTimer;
  function wake() {
    if (sleeping) { sleeping = false; cat.classList.remove('sleep'); zzz.classList.remove('on'); }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => catAPI.sleep(true), 20000);
  }

  window.catAPI = {
    begin() { wrap.classList.remove('entered'); void wrap.offsetWidth; wrap.classList.add('entered'); },
    hover(on) { cat.classList.toggle('alert', on); },
    click() {
      cat.classList.remove('flick', 'squash'); void cat.offsetWidth;
      cat.classList.add('flick', 'squash');
      setTimeout(() => cat.classList.remove('flick', 'squash'), 600);
    },
    egg() {
      cat.classList.remove('egging'); void cat.offsetWidth;
      cat.classList.add('egging');
      setTimeout(() => { ci++; applyCoat(ci); }, 380);
      setTimeout(() => cat.classList.remove('egging'), 850);
    },
    sleep(force) {
      sleeping = force === undefined ? !sleeping : force;
      cat.classList.toggle('sleep', sleeping);
      zzz.classList.toggle('on', sleeping);
      if (!sleeping) schedBlink();
    },
    variant(n) { ci = n; applyCoat(n); },
  };

  applyCoat(0);
  schedBlink();
  if (reduced) { document.querySelectorAll('*').forEach(()=>{}); }
  setTimeout(() => catAPI.begin(), 400);
})();
</script>
</body>
</html>
