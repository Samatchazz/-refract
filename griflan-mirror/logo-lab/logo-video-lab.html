<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Plan C — ตรวจวิดีโอโลโก้ใหม่</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f1613;color:#f2efde;font-family:sans-serif;padding:20px;line-height:1.5}
  h1{font-size:16px;color:#f0b32e;margin-bottom:10px}
  h2{font-size:13px;color:#f0b32e;margin:18px 0 8px}
  #sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:960px}
  #sheet canvas{width:100%;background:#fff;border-radius:4px}
  #sheet div{position:relative}
  #sheet span{position:absolute;left:3px;top:3px;font-size:9px;background:#000;color:#0f0;padding:0 3px;border-radius:2px}
  pre{font-size:11px;background:#00000055;padding:10px;border-radius:6px;max-width:960px;white-space:pre-wrap}
  .row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
  .row>div{text-align:center;font-size:11px}
  .stage{width:190px;height:190px;display:grid;place-items:center;border-radius:8px;overflow:hidden}
  .onDark{background:#0f1613}.onCream{background:#f2efde}.onGold{background:#f0b32e}
  .stage canvas,.stage video{width:180px;height:180px;object-fit:contain;max-width:none}
</style>
</head>
<body>
<h1>วิดีโอโลโก้ใหม่ (logo-anim.mp4)</h1>
<pre id="info">กำลังโหลด…</pre>

<h2>คอนแทคชีต 18 เฟรม (พื้นขาว = ต้นฉบับ)</h2>
<div id="sheet"></div>

<h2>ไดคัทพื้นขาวออก แล้ววางบนพื้นสามแบบ</h2>
<div class="row">
  <div><div class="stage onDark"><canvas id="dA" width="312" height="312"></canvas></div>บนเขียวเข้ม (ดำจม)</div>
  <div><div class="stage onDark"><canvas id="dB" width="312" height="312"></canvas></div>ไดคัท + ย้อมครีม</div>
  <div><div class="stage onCream"><canvas id="dC" width="312" height="312"></canvas></div>ดำบนครีม</div>
  <div><div class="stage onGold"><canvas id="dD" width="312" height="312"></canvas></div>ดำบนทอง</div>
</div>

<script>
const SRC='/assets/video/logo-anim.mp4';
const v=document.createElement('video');
v.src=SRC; v.muted=true; v.playsInline=true; v.preload='auto';
const sheet=document.getElementById('sheet'), info=document.getElementById('info');
const N=18, stats=[];

function analyse(ctx,w,h){
  const d=ctx.getImageData(0,0,w,h).data;
  let dark=0, mid=0, colored=0, minX=w, maxX=0, minY=h, maxY=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4, r=d[i],g=d[i+1],b=d[i+2];
    const lum=(r+g+b)/3, sat=Math.max(r,g,b)-Math.min(r,g,b);
    if(sat>28) colored++;
    if(lum<90){dark++; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;}
    else if(lum<200) mid++;
  }
  const T=w*h;
  return {dark:+(dark/T*100).toFixed(1), edge:+(mid/T*100).toFixed(1), colored:+(colored/T*100).toFixed(2),
          box:[minX,minY,maxX,maxY]};
}

v.addEventListener('loadedmetadata', async ()=>{
  const W=v.videoWidth, H=v.videoHeight, D=v.duration;
  info.textContent=`ขนาด ${W}×${H} · ยาว ${D.toFixed(2)} วิ`;
  for(let k=0;k<N;k++){
    const t=D*(k/N);
    await new Promise(res=>{ v.onseeked=res; v.currentTime=Math.min(t, D-0.01); });
    const wrap=document.createElement('div');
    const c=document.createElement('canvas'); c.width=156; c.height=156;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.drawImage(v,0,0,156,156);
    stats.push(analyse(x,156,156));
    const s=document.createElement('span'); s.textContent=t.toFixed(2)+'s';
    wrap.appendChild(c); wrap.appendChild(s); sheet.appendChild(wrap);
  }
  const dk=stats.map(s=>s.dark), col=stats.map(s=>s.colored), eg=stats.map(s=>s.edge);
  const bx=stats.map(s=>s.box);
  info.textContent =
    `ขนาด ${W}×${H} · ยาว ${D.toFixed(2)} วิ\n`+
    `พิกเซลเข้ม(ตัวแมว): ${Math.min(...dk)}% – ${Math.max(...dk)}% ของเฟรม\n`+
    `พิกเซลกึ่งกลาง(ขอบ antialias): ${Math.min(...eg)}% – ${Math.max(...eg)}%\n`+
    `พิกเซลมีสี: สูงสุด ${Math.max(...col)}%  → ${Math.max(...col)<1?'ขาว-ดำล้วน ✅ ไดคัทได้สะอาด':'มีสีปน ⚠'}\n`+
    `กรอบตัวแมว (เฟรมแรก→กลาง→ท้าย): ${JSON.stringify(bx[0])} ${JSON.stringify(bx[9])} ${JSON.stringify(bx[N-1])}\n`+
    `การขยับกรอบ X: ${Math.min(...bx.map(b=>b[0]))}→${Math.max(...bx.map(b=>b[2]))}  Y: ${Math.min(...bx.map(b=>b[1]))}→${Math.max(...bx.map(b=>b[3]))}`;
  window.__stats=stats; window.__meta={W,H,D};

  // live die-cut demo
  v.loop=true; v.currentTime=0; v.play().catch(()=>{});
  const work=document.createElement('canvas'); work.width=work.height=312;
  const wx=work.getContext('2d',{willReadFrequently:true});
  const outs=[['dA',null],['dB',[242,239,222]],['dC',null],['dD',null]].map(([id,t])=>
    ({x:document.getElementById(id).getContext('2d'),tint:t}));
  (function loop(){
    if(v.readyState>=2){
      wx.clearRect(0,0,312,312); wx.drawImage(v,0,0,312,312);
      const img=wx.getImageData(0,0,312,312), d=img.data;
      for(let i=0;i<d.length;i+=4){
        const lum=(d[i]+d[i+1]+d[i+2])/3;
        d[i+3]=Math.max(0,Math.min(255,255-lum*1.15));
      }
      outs.forEach(o=>{
        const cp=new Uint8ClampedArray(d);
        if(o.tint) for(let i=0;i<cp.length;i+=4){cp[i]=o.tint[0];cp[i+1]=o.tint[1];cp[i+2]=o.tint[2];}
        o.x.clearRect(0,0,312,312);
        o.x.putImageData(new ImageData(cp,312,312),0,0);
      });
    }
    requestAnimationFrame(loop);
  })();
});
v.load();
</script>
</body>
</html>
