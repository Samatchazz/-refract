<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Plan C — พรีวิวจุดตัด / จุดเด้ง</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f1613; color:#f2efde; font-family:sans-serif; padding:18px; }
  h1 { font-size:17px; color:#f0b32e; margin-bottom:4px; }
  p.hint { font-size:12.5px; color:rgba(242,239,222,.6); margin-bottom:12px; line-height:1.7; }
  canvas { display:block; max-width:100%; height:auto; border-radius:8px; cursor:crosshair;
    border:1px dashed rgba(242,239,222,.2); }
  .ctrl { margin-top:14px; display:flex; flex-wrap:wrap; gap:18px; align-items:center; }
  .ctrl label { font-size:13px; display:flex; align-items:center; gap:8px; }
  input[type=range] { width:230px; accent-color:#f0b32e; }
  .val { color:#f0b32e; font-weight:bold; min-width:52px; display:inline-block; }
  button { background:transparent; border:1px solid rgba(240,179,46,.55); color:#f0b32e;
    border-radius:99px; padding:7px 15px; font-size:13px; cursor:pointer; }
  button:hover { background:#f0b32e; color:#0f1613; }
  .readout { margin-top:14px; background:rgba(240,179,46,.1); border:1px solid rgba(240,179,46,.4);
    border-radius:8px; padding:12px 16px; display:inline-block; font-size:13.5px; line-height:1.9; }
  code { background:rgba(242,239,222,.12); padding:2px 8px; border-radius:4px; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
<h1>พรีวิวจุดตัด / จุดเด้ง</h1>
<p class="hint">
  <span class="sw" style="background:#f2efde"></span><b>ครีม</b> = ชิ้นที่อยู่นิ่ง &nbsp;·&nbsp;
  <span class="sw" style="background:#f0b32e"></span><b>ทอง</b> = ชิ้นที่จะขยับ &nbsp;·&nbsp;
  <span class="sw" style="background:#ff4d4d"></span><b>กากบาทแดง</b> = จุดเด้ง (คลิกบนภาพเพื่อย้าย)<br>
  เลื่อน <b>"จุดตัด"</b> เพื่อเลือกว่าชิ้นไหนจะเป็นหาง · เลื่อน <b>"ทดสอบมุม"</b> หรือกด <b>เล่น</b> เพื่อดูการขยับ
</p>

<canvas id="cv" width="1024" height="1024"></canvas>

<div class="ctrl">
  <label>จุดตัด x: <input type="range" id="cut" min="600" max="1900" value="1086"><span class="val" id="cutV">1086</span></label>
  <label>เอียงเส้นตัด: <input type="range" id="cutAng" min="-60" max="60" value="-4"><span class="val" id="cutAngV">-4°</span></label>
  <label>ความยาวเส้นตัด: <input type="range" id="cutLen" min="200" max="2600" value="2600"><span class="val" id="cutLenV">2600</span></label>
  <label>ทดสอบมุม: <input type="range" id="ang" min="-30" max="10" value="0"><span class="val" id="angV">0°</span></label>
  <button id="play">▶ เล่น</button>
</div>

<div class="readout" id="out"></div>

<script>
const CV=document.getElementById('cv'), X=CV.getContext('2d');
const SCALE=0.5;                       // 2048 → 1024
let cut=1086, cutAng=-4, cutLen=2600, ang=0, pivot={x:1069,y:966}, playing=false, t0=0;
const CUT_REF_Y=1150;   // จุดหมุนของเส้นตัดเวลาเอียง (กลางโซนข้อต่อหาง)
let cream=null, gold=null;

const img=new Image();
img.onload=()=>{
  // สร้างภาพโลโก้ 2 เวอร์ชัน (ครีม/ทอง) ไว้ล่วงหน้า → เลื่อนสไลเดอร์แล้วลื่น
  cream=tint('#f2efde'); gold=tint('#f0b32e');
  draw();
};
img.src='assets/logo-closed.png';

function tint(color){
  const W=2048, c=document.createElement('canvas'); c.width=c.height=W;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(img,0,0,W,W);
  const d=x.getImageData(0,0,W,W);
  for(let i=0;i<d.data.length;i+=4){
    const lum=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
    d.data[i+3]=255-lum; d.data[i]=d.data[i+1]=d.data[i+2]=255;
  }
  x.putImageData(d,0,0);
  x.globalCompositeOperation='source-in';
  x.fillStyle=color; x.fillRect(0,0,W,W);
  return c;
}

function draw(){
  X.fillStyle='#0f1613'; X.fillRect(0,0,1024,1024);
  if(!cream) return;
  X.save(); X.scale(SCALE,SCALE);

  const cr=cutAng*Math.PI/180, half=cutLen/2;

  // ชิ้นที่อยู่นิ่ง = ทุกอย่าง "ยกเว้น" โซนที่ขยับ (ใช้ evenodd หาส่วนเติมเต็ม)
  X.save();
  X.translate(cut,CUT_REF_Y); X.rotate(cr);
  X.beginPath();
  X.rect(-20000,-20000,40000,40000);      // ทั้งภาพ
  X.rect(0,-half,8192,cutLen);            // เจาะโซนที่ขยับออก
  X.clip('evenodd');
  X.rotate(-cr); X.translate(-cut,-CUT_REF_Y);
  X.drawImage(cream,0,0); X.restore();

  // ชิ้นที่ขยับ = ฝั่งขวาของเส้น + อยู่ในช่วงความยาวที่กำหนด (clip หมุนตามชิ้น)
  X.save();
  X.translate(pivot.x,pivot.y); X.rotate(ang*Math.PI/180); X.translate(-pivot.x,-pivot.y);
  X.translate(cut,CUT_REF_Y); X.rotate(cr);
  X.beginPath(); X.rect(0,-half,8192,cutLen); X.clip();
  X.rotate(-cr); X.translate(-cut,-CUT_REF_Y);
  X.drawImage(gold,0,0); X.restore();

  // เส้นตัด (เอียง + ยาวตามค่าที่ตั้ง) พร้อมหมุดหัว-ท้ายบอกขอบเขต
  X.save(); X.translate(cut,CUT_REF_Y); X.rotate(cr);
  X.strokeStyle='#4da6ff'; X.lineWidth=6; X.setLineDash([18,12]);
  X.beginPath(); X.moveTo(0,-half); X.lineTo(0,half); X.stroke(); X.setLineDash([]);
  X.lineWidth=5;
  X.beginPath();
  X.moveTo(-40,-half); X.lineTo(40,-half);
  X.moveTo(-40, half); X.lineTo(40, half); X.stroke();
  X.fillStyle='#4da6ff'; X.font='bold 30px sans-serif';
  X.fillText(`x=${cut} · ${cutAng}° · ยาว ${cutLen}`, 14, -half+42);
  X.restore();

  // จุดเด้ง
  X.strokeStyle='#ff4d4d'; X.lineWidth=5;
  X.beginPath(); X.arc(pivot.x,pivot.y,26,0,7); X.stroke();
  X.beginPath();
  X.moveTo(pivot.x-52,pivot.y); X.lineTo(pivot.x+52,pivot.y);
  X.moveTo(pivot.x,pivot.y-52); X.lineTo(pivot.x,pivot.y+52); X.stroke();
  X.fillStyle='#ff4d4d'; X.font='bold 28px sans-serif';
  X.fillText(`จุดเด้ง (${pivot.x}, ${pivot.y})`, pivot.x+34, pivot.y-34);

  X.restore();
  document.getElementById('out').innerHTML =
    `<code>const TAIL_CUT_X = ${cut};</code><br>` +
    `<code>const TAIL_CUT_ANGLE = ${cutAng};</code>` +
    (cutAng ? '' : ' <span style="opacity:.55">(0 = เส้นตั้งตรง)</span>') + `<br>` +
    `<code>const TAIL_CUT_LEN = ${cutLen};</code>` +
    (cutLen>=2600 ? ' <span style="opacity:.55">(สุด = ผ่าทั้งภาพ)</span>' : '') + `<br>` +
    `<code>const TAIL_ROOT = { x: ${pivot.x}, y: ${pivot.y} };</code><br>` +
    `<span style="opacity:.7">ส่ง 4 บรรทัดนี้ให้ผม แล้วผมใส่ให้ตรงเป๊ะ</span>`;
}

document.getElementById('cut').addEventListener('input', e=>{
  cut=+e.target.value; document.getElementById('cutV').textContent=cut; draw(); });
document.getElementById('cutAng').addEventListener('input', e=>{
  cutAng=+e.target.value; document.getElementById('cutAngV').textContent=cutAng+'°'; draw(); });
document.getElementById('cutLen').addEventListener('input', e=>{
  cutLen=+e.target.value; document.getElementById('cutLenV').textContent=cutLen; draw(); });
document.getElementById('ang').addEventListener('input', e=>{
  ang=+e.target.value; document.getElementById('angV').textContent=ang+'°'; playing=false;
  document.getElementById('play').textContent='▶ เล่น'; draw(); });

CV.addEventListener('click', e=>{
  const r=CV.getBoundingClientRect(), k=CV.width/r.width;
  pivot={ x:Math.round((e.clientX-r.left)*k/SCALE), y:Math.round((e.clientY-r.top)*k/SCALE) };
  draw();
});

document.getElementById('play').addEventListener('click', ()=>{
  playing=!playing;
  document.getElementById('play').textContent = playing ? '⏸ หยุด' : '▶ เล่น';
  if(playing){ t0=performance.now(); loop(); }
});
function loop(){
  if(!playing) return;
  const el=(performance.now()-t0)/1000;
  ang = -14 * Math.exp(-el*1.1) * Math.sin(el*7);   // เด้งแล้วคลายตัว
  if(el>4){ t0=performance.now(); }
  document.getElementById('ang').value=Math.round(ang);
  document.getElementById('angV').textContent=Math.round(ang)+'°';
  draw(); requestAnimationFrame(loop);
}
</script>
</body>
</html>
