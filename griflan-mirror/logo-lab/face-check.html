<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><title>ตรวจหน้าแมว</title>
<style>
 body{background:#0f1613;color:#f2efde;font:13px/1.6 sans-serif;padding:20px}
 h1{color:#f0b32e;font-size:15px}
 .row{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0;align-items:flex-start}
 .row>div{font-size:11px;color:#999;text-align:center}
 canvas{image-rendering:pixelated;border-radius:8px;display:block}
 pre{background:#00000055;padding:10px;border-radius:6px;font-size:11.5px;white-space:pre-wrap;max-width:820px}
 svg{background:#181616;border-radius:8px}
</style></head>
<body>
<h1>เทียบโซนหน้าแมว: ต้นฉบับ vs เวกเตอร์ที่ trace มา</h1>
<div class="row" id="row"></div>
<h1>ชิ้นส่วนทั้งหมด แยกสี</h1>
<div class="row" id="parts"></div>
<pre id="out">…</pre>

<script>
const NS='http://www.w3.org/2000/svg';
// โซนหัว (จาก bbox #0)
const ZOOM={x:40,y:155,w:190,h:265}, SC=3;

function svgOf(subs, mode){
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox','0 0 624 624');
  s.setAttribute('width',624); s.setAttribute('height',624);
  if(mode==='parts'){
    const cols=['#e6194b','#3cb44b','#ffe119','#4363d8','#f58231','#911eb4','#46f0f0','#f032e6'];
    subs.forEach((d,i)=>{const p=document.createElementNS(NS,'path');
      p.setAttribute('d',d); p.setAttribute('fill',cols[i%8]); s.appendChild(p);});
  } else {
    // ทึบทั้งหมดเป็นดำ แล้วให้ evenodd เจาะรูเอง (เหมือน potrace ตั้งใจ)
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d', subs.join(' '));
    p.setAttribute('fill','#000'); p.setAttribute('fill-rule','evenodd');
    s.appendChild(p);
  }
  return s;
}
function toCanvas(el,cb){
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=624;
   const x=c.getContext('2d',{willReadFrequently:true});
   x.fillStyle='#fff';x.fillRect(0,0,624,624);x.drawImage(img,0,0);cb(c);};
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(new XMLSerializer().serializeToString(el))));
}
function crop(srcCanvasOrImg,label,parent){
  const c=document.createElement('canvas');
  c.width=ZOOM.w*SC; c.height=ZOOM.h*SC;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  x.drawImage(srcCanvasOrImg, ZOOM.x,ZOOM.y,ZOOM.w,ZOOM.h, 0,0,c.width,c.height);
  const w=document.createElement('div'); w.appendChild(c);
  w.appendChild(document.createTextNode(label)); parent.appendChild(w);
  return c;
}

fetch('_frame1_fine.json').then(r=>r.json()).then(subs=>{
  const row=document.getElementById('row');
  const ref=new Image();
  ref.onload=()=>{
    const rc=crop(ref,'ต้นฉบับ (เฟรม 1)',row);
    toCanvas(svgOf(subs,'evenodd'), tc=>{
      const vc=crop(tc,'เวกเตอร์ evenodd',row);
      // diff
      const A=rc.getContext('2d',{willReadFrequently:true}).getImageData(0,0,rc.width,rc.height).data;
      const B=vc.getContext('2d',{willReadFrequently:true}).getImageData(0,0,vc.width,vc.height).data;
      const dc=document.createElement('canvas'); dc.width=rc.width; dc.height=rc.height;
      const dx=dc.getContext('2d'); const id=dx.createImageData(dc.width,dc.height);
      let diff=0;
      for(let i=0;i<A.length;i+=4){
        const a=(A[i]+A[i+1]+A[i+2])/3<128, b=(B[i]+B[i+1]+B[i+2])/3<128;
        if(a!==b){diff++; id.data[i]=255; id.data[i+1]=0; id.data[i+2]=0; id.data[i+3]=255;}
        else {const v=a?30:255; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255;}
      }
      dx.putImageData(id,0,0);
      const w=document.createElement('div'); w.appendChild(dc);
      w.appendChild(document.createTextNode('ต่างกัน (แดง) = '+diff+' px'));
      row.appendChild(w);
      document.getElementById('out').textContent =
        'โซนที่ซูม: x'+ZOOM.x+' y'+ZOOM.y+' '+ZOOM.w+'×'+ZOOM.h+' (ขยาย '+SC+' เท่า)\n'+
        'พิกเซลที่ต่างกันในโซนหัว: '+diff+' จาก '+(dc.width*dc.height)+' ('+(diff/(dc.width*dc.height)*100).toFixed(2)+'%)';
    });
    // แยกสี
    const p=document.getElementById('parts');
    toCanvas(svgOf(subs,'parts'), pc=>{ crop(pc,'ชิ้นส่วน (ซูมหัว)',p);
      const full=document.createElement('canvas'); full.width=full.height=330;
      full.getContext('2d').drawImage(pc,0,0,330,330);
      const w=document.createElement('div'); w.appendChild(full);
      w.appendChild(document.createTextNode('ชิ้นส่วน (เต็ม)')); p.appendChild(w); });
  };
  ref.src='/_tools/frames/f_001.png';
});
</script>
</body></html>
