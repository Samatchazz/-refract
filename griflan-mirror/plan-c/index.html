/* ---------- คณิตพื้นดิน ---------- */
function heightAt(t){
  t=Math.max(0,Math.min(1,t));
  for(let i=0;i<STAGES.length-1;i++){
    const a=STAGES[i],b=STAGES[i+1];
    if(t>=a.x&&t<=b.x){
      const u=(b.x-a.x)?(t-a.x)/(b.x-a.x):0;
      return a.h+(b.h-a.h)*(u*u*(3-2*u));
    }
  }
  return STAGES[STAGES.length-1].h;
}
let VW=0,VH=0,WORLD=0,BASE=0,CLIMB=0;
const SCREEN_X=0.715;
function groundY(t){ return BASE-heightAt(t)*CLIMB; }

/* ---------- สี ---------- */
function hex(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}
function mix(a,b,u){const A=hex(a),B=hex(b);
  return `rgb(${Math.round(A[0]+(B[0]-A[0])*u)},${Math.round(A[1]+(B[1]-A[1])*u)},${Math.round(A[2]+(B[2]-A[2])*u)})`;}
function skyAt(t){
  for(let i=0;i<STAGES.length-1;i++){
    const a=STAGES[i],b=STAGES[i+1];
    if(t>=a.x&&t<=b.x){
      const u=(b.x-a.x)?(t-a.x)/(b.x-a.x):0, s=u*u*(3-2*u);
      return [mix(a.sky[0],b.sky[0],s),mix(a.sky[1],b.sky[1],s)];
    }
  }
  const L=STAGES[STAGES.length-1]; return [L.sky[0],L.sky[1]];
}

function mkSvg(w,h){const s=document.createElementNS(NS,'svg');
  s.setAttribute('width',w);s.setAttribute('height',h);
  s.setAttribute('viewBox',`0 0 ${w} ${h}`);s.style.display='block';return s;}
function E(n,a,p){const e=document.createElementNS(NS,n);
  for(const k in a)e.setAttribute(k,a[k]); if(p)p.appendChild(e); return e;}

/* --- ฝุ่น/ดาว: จุดสุ่มแบบกำหนดเมล็ด ให้เหมือนเดิมทุกครั้ง --- */
let seed=7;
const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};

/* เลเยอร์พารัลแลกซ์ f เลื่อนแค่ f เท่าของระยะจริง →
   กว้างแค่ f*(WORLD-VW)+VW พอ  และเนื้อหาที่พิกัด x จะถูกเห็นตอน cur = seenAt(x,f)
   ถ้าไม่แปลงกลับ การจาง/รูปทรงจะไม่ตรงกับองก์ที่ผู้ใช้กำลังดู */
const spanOf=f=>f*(WORLD-VW)+VW;
const seenAt=(x,f)=>{const d=f*(WORLD-VW);return d>0?Math.max(0,Math.min(1,(x-VW/2)/d)):0;};

  const W=spanOf(0.16), s=mkSvg(W,VH);
  for(let i=0;i<230;i++){
    const x=rnd()*W, y=rnd()*VH*0.72, r=rnd()*1.5+0.35;
    E('circle',{cx:x.toFixed(0),cy:y.toFixed(0),r:r.toFixed(2),
      fill:'#f5f2e4','fill-opacity':(0.05+rnd()*0.22).toFixed(3)},s);
  }
  dust.appendChild(s);
}

/* --- ชั้นไกล: ตารางหมากรุกช่วงต้น แล้วจางเป็นเส้นกริดเรียบ --- */
function buildFar(){
  far.innerHTML='';
  const W=spanOf(0.34), s=mkSvg(W,VH), c=Math.round(VH*0.09);
  for(let x=0;x<W;x+=c){
    const t=seenAt(x,0.34);
    const chess=Math.max(0,1-Math.max(0,(t-0.20))/0.28);   // จางหายหลังเลิกหมากรุก
    if(chess<=0.02) continue;
    for(let y=VH*0.10;y<VH*0.95;y+=c)
      if(((x/c|0)+(y/c|0))%2===0)
        E('rect',{x,y,width:c,height:c,fill:'#f5f2e4',
          'fill-opacity':(0.030*chess).toFixed(4)},s);
  }
  // เส้นกริดแนวตั้งบางๆ ตลอดทาง = ระบบที่เข้ามาแทน
  for(let x=0;x<W;x+=c*2){
    const t=seenAt(x,0.34), g=Math.min(1,Math.max(0,(t-0.34)/0.3));
    if(g<=0.02) continue;
    E('line',{x1:x,y1:0,x2:x,y2:VH,stroke:'#f5f2e4',
      'stroke-opacity':(0.035*g).toFixed(4),'stroke-width':1},s);
  }
  far.appendChild(s);
}

/* --- ชั้นกลาง: เงาภูเขา/ตึกไกลๆ ให้มีความลึก --- */
function buildMid(){
  mid.innerHTML='';
  const W=spanOf(0.58), s=mkSvg(W,VH);
  seed=91;
  let d=`M0,${VH}`;
  const step=Math.round(VW*0.16);
  for(let x=0;x<=W;x+=step){
    const t=seenAt(x,0.58);
    const base=VH-(0.10+heightAt(t)*0.30)*VH*0.62;
    const jag=(rnd()-0.5)*VH*0.055;
    d+=` L${x},${(base+jag).toFixed(0)}`;
  }
  d+=` L${W},${VH} Z`;
  E('path',{d,fill:'#f5f2e4','fill-opacity':.035},s);
  mid.appendChild(s);
}

/* --- พื้นดิน: เส้นกราฟเรืองแสง + พื้นที่ใต้กราฟ --- */
function buildGround(){
  ground.innerHTML='';
  const s=mkSvg(WORLD,VH);
  const defs=E('defs',{},s);
  const lg=E('linearGradient',{id:'gfill',x1:0,y1:0,x2:0,y2:1},defs);
  E('stop',{offset:'0%','stop-color':'#f0b32e','stop-opacity':.14},lg);
  E('stop',{offset:'55%','stop-color':'#f0b32e','stop-opacity':.03},lg);
  E('stop',{offset:'100%','stop-color':'#f0b32e','stop-opacity':0},lg);
  const f=E('filter',{id:'glow',x:'-12%',y:'-60%',width:'124%',height:'320%'},defs);
  E('feGaussianBlur',{stdDeviation:9,result:'b'},f);
  const m=E('feMerge',{},f); E('feMergeNode',{in:'b'},m); E('feMergeNode',{in:'SourceGraphic'},m);

  const N=Math.max(600,Math.round(WORLD/10));
  let top='';
  for(let i=0;i<=N;i++){
    const t=i/N;
    top+=(i?' L':'M')+(t*WORLD).toFixed(1)+','+groundY(t).toFixed(1);
  }
  E('path',{d:top+` L${WORLD},${VH} L0,${VH} Z`,fill:'url(#gfill)'},s);
  E('path',{d:top,fill:'none',stroke:'#f0b32e','stroke-width':6,
    'stroke-opacity':.20,filter:'url(#glow)'},s);
  E('path',{d:top,fill:'none',stroke:'#f5f2e4','stroke-width':1.7,
    'stroke-opacity':.92,'stroke-linecap':'round'},s);
  // ขีดสเกลเหมือนแกนกราฟ
  const tk=Math.round(WORLD/110);
  for(let i=0;i<=110;i++){
    const t=i/110,x=t*WORLD,y=groundY(t);
    E('line',{x1:x,y1:y+7,x2:x,y2:y+15,stroke:'#f5f2e4',
      'stroke-opacity':.13,'stroke-width':1},s);
  }
  ground.appendChild(s);
}

/* --- รูปทรงของประกอบ (พิกัด 0..100 กว้าง, ฐานอยู่ y=100) --- */
function shape(type){
  switch(type){
    case 'pawn': return 'M50,8 A11,11 0 1,1 49.9,8 Z M39,26 Q50,32 61,26 L66,66 Q50,72 34,66 Z M26,100 L74,100 L69,84 L31,84 Z';
    case 'rook': return 'M28,20 L34,20 L34,29 L42,29 L42,20 L58,20 L58,29 L66,29 L66,20 L72,20 L72,38 L65,44 L67,80 L33,80 L35,44 L28,38 Z M24,100 L76,100 L72,84 L28,84 Z';
    case 'king': return 'M46,0 L54,0 L54,8 L62,8 L62,16 L54,16 L54,26 L46,26 L46,16 L38,16 L38,8 L46,8 Z M37,32 Q50,40 63,32 L68,68 Q50,76 32,68 Z M24,100 L76,100 L71,84 L29,84 Z';
    case 'tower':return 'M30,100 L30,34 L38,34 L38,24 L46,24 L46,34 L54,34 L54,20 L62,20 L62,34 L70,34 L70,100 Z';
    default: return '';
  }
}
function buildProps(){
  props.innerHTML='';
  const s=mkSvg(WORLD,VH);
  const defs=E('defs',{},s);
  const f=E('filter',{id:'pglow',x:'-70%',y:'-70%',width:'240%',height:'240%'},defs);
  E('feGaussianBlur',{stdDeviation:6},f);

  PROPS.forEach((p,i)=>{
    const x=p.x*WORLD, y=groundY(p.x);
    const g=E('g',{'data-i':i,'data-x':p.x},s);
    g.style.transformOrigin=`${x}px ${y}px`;
    g.style.transition='transform .8s cubic-bezier(.3,1.4,.5,1), opacity .6s';

    if(p.t==='pillar'){
      const h=VH*0.30*p.s;
      E('rect',{x:x-1.5,y:y-h,width:3,height:h,fill:'#f5f2e4','fill-opacity':.22},g);
      E('circle',{cx:x,cy:y-h,r:14,fill:'#f0b32e','fill-opacity':.18,filter:'url(#pglow)'},g);
      E('circle',{cx:x,cy:y-h,r:5.5,fill:'#f0b32e'},g);
      const tx=E('text',{x:x+16,y:y-h+5,fill:'#f0b32e','font-size':13,
        'font-family':'Segoe UI, sans-serif','font-weight':700,'letter-spacing':2},g);
      tx.textContent=p.label;
    }
    else if(p.t==='flag'){
      const h=VH*0.20*p.s;
      E('rect',{x:x-1.5,y:y-h,width:3,height:h,fill:'#f5f2e4','fill-opacity':.5},g);
      E('path',{d:`M${x+1.5},${y-h} L${x+58*p.s},${y-h+13*p.s} L${x+1.5},${y-h+26*p.s} Z`,
        fill:'#f0b32e','fill-opacity':.85},g);
    }
    else if(p.t==='chip'){
      const r=VH*0.05*p.s;
      E('circle',{cx:x,cy:y-r*1.15,r,fill:'none',stroke:'#f0b32e',
        'stroke-width':2,'stroke-opacity':.65},g);
      E('circle',{cx:x,cy:y-r*1.15,r:r*0.58,fill:'none',stroke:'#f0b32e',
        'stroke-width':1.2,'stroke-opacity':.4,'stroke-dasharray':'4 5'},g);
    }
    else if(p.t==='card'){
      const w=VH*0.055*p.s,h=w*1.42;
      E('rect',{x:x-w/2,y:y-h,width:w,height:h,rx:w*0.10,fill:'none',
        stroke:'#f5f2e4','stroke-width':1.5,'stroke-opacity':.55,
        transform:`rotate(${(i%2?-11:9)} ${x} ${y})`},g);
    }
    else{
      const h=VH*0.155*p.s, w=h;
      E('path',{d:shape(p.t),fill:'#f5f2e4','fill-opacity':p.t==='tower'?.10:.30,
        transform:`translate(${x-w/2} ${y-h}) scale(${w/100} ${h/100})`},g);
    }
  });
  props.appendChild(s);
}

function buildCopy(){
  copy.innerHTML='';
  STAGES.forEach((st,i)=>{
    const d=document.createElement('div');
    d.className='panel';
    d.style.left=(st.x*(WORLD-VW)*0.94)+'px';
    d.style.width=VW+'px';
    // ยกข้อความให้ลอยเหนือพื้นเสมอ — พอกราฟไต่ขึ้น ข้อความต้องขึ้นตาม ไม่งั้นเส้นพาดทับ
    d.style.paddingBottom=(heightAt(st.x)*CLIMB+VH*0.13)+'px';
    d.innerHTML =
      (st.num?`<span class="num">${st.num}</span>`:'')+
      `<span class="tag${st.tag.length>26?' long':''}">${st.tag}</span>`+
      (st.title?`<h2>${st.title}</h2>`:'')+
      (st.quote?`<div class="quote">${st.quote}</div>`:'')+
      (st.body?`<p>${st.body}</p>`:'')+
      (st.list?`<ul>${st.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:'')+
      (st.who?`<div class="who">${st.who}</div>`:'')+
      (st.cta?`<span class="cta">${st.cta} &nbsp;→</span>`:'');
    copy.appendChild(d);
  });
}

function buildHud(){
  bar.querySelectorAll('b').forEach(b=>b.remove());
  STAGES.forEach(st=>{
    const b=document.createElement('b');
    b.style.left=(st.x*100)+'%'; bar.appendChild(b);
  });
}

/* ---------- แมว ---------- */
const INK_BOT=406.5/624, INK_H=(406.5-166.1)/624;   // วัดจาก getBBox จริงของ rig
let rig=null,CAT=110;
function buildCat(){
  CAT=Math.round(Math.max(58,Math.min(122,VH*0.132))/INK_H);
  cat.style.width=CAT+'px'; cat.style.height=CAT+'px';
  if(!rig&&window.PlanCRig){
    rig=window.PlanCRig.mount($('#rigbox'),{coat:'#f5f2e4',openMs:1600,hitArea:cat});
    cat.style.pointerEvents='auto'; cat.style.cursor='pointer';
  }
}

/* ======================================================================
   ลูป
   ====================================================================== */
let target=0,cur=0,dist=0,last=0;

function layout(){
  VW=innerWidth; VH=innerHeight;
  WORLD=Math.round(VW*(STAGES.length*0.95));
  BASE=VH*0.845; CLIMB=VH*0.47;
  document.body.style.setProperty('--scroll-h',Math.round(WORLD*0.95)+'px');
  buildDust();buildFar();buildMid();buildGround();buildProps();buildCopy();buildHud();buildCat();
}
function onScroll(){
  const m=document.body.scrollHeight-innerHeight;
  target=m>0?scrollY/m:0;
}

const propG=()=>props.querySelectorAll('g[data-i]');
let propEls=[];

function frame(){
  cur+=(target-cur)*0.082;
  const travel=cur*(WORLD-VW);
  const speed=Math.abs(cur-last)*(WORLD-VW);
  dist+=speed; last=cur;

  const [c0,c1]=skyAt(cur);
  sky.style.background=`linear-gradient(175deg,${c0} 0%,${c1} 100%)`;

  dust.style.transform  =`translate3d(${-travel*0.16}px,0,0)`;
  far.style.transform   =`translate3d(${-travel*0.34}px,0,0)`;
  mid.style.transform   =`translate3d(${-travel*0.58}px,0,0)`;
  ground.style.transform=`translate3d(${-travel}px,0,0)`;
  props.style.transform =`translate3d(${-travel}px,0,0)`;
  copy.style.transform  =`translate3d(${-travel*0.94}px,0,0)`;

  // แมวเกาะเส้นพอดี
  const catT=WORLD?(travel+VW*SCREEN_X)/WORLD:0;
  const gy=groundY(catT);
  const dx=VW*0.004;
  const slope=Math.atan2(groundY(catT+dx/WORLD)-groundY(catT-dx/WORLD),dx*2)*180/Math.PI;
  const bob=Math.sin(dist/25)*Math.min(7,speed*0.5);
  const lean=Math.max(-9,Math.min(9,(target-cur)*88));
  cat.style.transform=
    `translate3d(${VW*SCREEN_X-CAT*0.5}px,${gy-CAT*INK_BOT+bob}px,0) `+
    `rotate(${(slope*0.55+lean*0.4).toFixed(2)}deg)`;

  // ของบนเส้นทางตอบสนอง: หมากรุกล้มหลังแมวผ่าน · ชิป/ไพ่ลอยขึ้นตอนเข้าใกล้
  for(let i=0;i<propEls.length;i++){
    const el=propEls[i],p=PROPS[i],d=catT-p.x;
    if(p.fall)      el.style.transform = d>0 ? 'rotate(78deg) translateY(4px)' : 'none';
    else if(p.rise){const n=Math.max(0,1-Math.abs(d)/0.055);
                    el.style.transform=`translateY(${((1-n)*40).toFixed(1)}px)`;
                    el.style.opacity=(0.15+n*0.85).toFixed(2);}
  }

  // แผงข้อความ
  const ps=copy.children; let near=0,nd=9;
  for(let i=0;i<ps.length;i++){
    const dd=Math.abs(STAGES[i].x-cur);
    if(dd<nd){nd=dd;near=i;}
    const o=Math.max(0,1-Math.pow(dd/0.058,2));
    ps[i].style.opacity=o.toFixed(3);
    for(let k=0;k<ps[i].children.length;k++){
      ps[i].children[k].style.opacity=o.toFixed(3);
      ps[i].children[k].style.transform=`translateY(${((1-o)*30).toFixed(1)}px)`;
    }
  }
  chap.textContent=STAGES[near].chap;
  chapno.textContent=String(near+1).padStart(2,'0')+' / '+String(STAGES.length).padStart(2,'0');
  bar.querySelectorAll('b').forEach((b,i)=>b.classList.toggle('on',i<=near));
  barFill.style.width=(cur*100).toFixed(1)+'%';
  pct.textContent=Math.round(cur*100)+'%';
  hint.style.opacity=cur>0.008?0:1;

  requestAnimationFrame(frame);
}

addEventListener('resize',()=>{layout();propEls=[...propG()];onScroll();});
addEventListener('scroll',onScroll,{passive:true});
layout(); propEls=[...propG()]; onScroll(); cur=target; last=target;
requestAnimationFrame(frame);

window.__planc={STAGES,PROPS,heightAt,get cur(){return cur;},get world(){return WORLD;}};
})();
</script>
</body>
