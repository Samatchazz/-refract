<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REFRACT — Saved Examples</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111318;
      --panel: #161b27;
      --border: #1e2130;
      --accent: #5b6af0;
      --accent-dark: #4a58e0;
      --accent-light: #1a1f3a;
      --text: #e8eaf2;
      --text-muted: #5a6178;
      --s1-bg: #161c35;
      --s1-border: #2a3060;
      --s1-color: #7c8ff5;
      --s2-bg: #0f2626;
      --s2-border: #1a4040;
      --s2-color: #3db4a0;
      --s3-bg: #251320;
      --s3-border: #4a1e30;
      --s3-color: #e05c7a;
      --shadow: 0 2px 16px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'IBM Plex Sans Thai', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.18em;
    }

    header a {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    header a:hover { color: var(--text); border-color: var(--accent); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 32px;
    }

    .page-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .page-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .stat strong { color: var(--accent); font-size: 1.3rem; display: block; font-family: 'IBM Plex Mono', monospace; }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead tr {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 11px 16px;
      text-align: left;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }

    td {
      padding: 13px 16px;
      vertical-align: top;
      color: var(--text);
    }

    .td-date { white-space: nowrap; color: var(--text-muted); font-size: 0.78rem; min-width: 110px; font-family: 'IBM Plex Mono', monospace; }
    .td-version { white-space: nowrap; min-width: 80px; }
    .td-draft { max-width: 240px; }
    .td-content { max-width: 320px; }

    .preview-text {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .version-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .badge-1 { background: var(--s1-bg); color: var(--s1-color); border: 1px solid var(--s1-border); }
    .badge-2 { background: var(--s2-bg); color: var(--s2-color); border: 1px solid var(--s2-border); }
    .badge-3 { background: var(--s3-bg); color: var(--s3-color); border: 1px solid var(--s3-border); }

    .active-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      color: var(--accent);
      letter-spacing: 0.06em;
      margin-top: 3px;
      display: block;
    }

    .btn-delete {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 10px;
      font-family: 'IBM Plex Sans Thai', sans-serif;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-delete:hover { border-color: var(--s3-color); color: var(--s3-color); }

    .empty-state {
      padding: 60px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-state .mono { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; letter-spacing: 0.12em; margin-bottom: 10px; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.82rem;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 9999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .modal h3 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .modal p { font-size: 0.88rem; line-height: 1.85; white-space: pre-wrap; color: var(--text); }

    .modal-close {
      display: block;
      margin-top: 20px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 7px;
      font-family: 'IBM Plex Sans Thai', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .modal-close:hover { background: var(--accent-dark); }
  </style>
</head>
<body>

<header>
  <h1>REFRACT</h1>
  <a href="/">← Generator</a>
</header>

<div class="container">
  <div class="page-title">Saved Examples</div>
  <div class="page-subtitle">3 รายการล่าสุดจะถูกใช้เป็น reference ใน generation ครั้งถัดไป</div>

  <div class="stats-bar">
    <div class="stat"><strong id="total-count">—</strong>total saved</div>
    <div class="stat"><strong>3</strong>active in pipeline</div>
  </div>

  <div class="table-wrap">
    <table id="examples-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Style</th>
          <th>Draft</th>
          <th>Output</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="5"><div class="empty-state"><p class="mono">LOADING...</p></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-body"></p>
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">ปิด</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let examples = [];

  function showToast(msg, dur = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), dur);
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' }) +
      '\n' + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  }

  function truncate(str, n = 100) {
    return str.length > n ? str.slice(0, n) + '…' : str;
  }

  function getLabel(ex) {
    return ex.writer_label || ex.version_label || '';
  }

  function getBadgeClass(ex) {
    const label = getLabel(ex);
    if (label === 'style1' || label.includes('1') || label.includes('A')) return 'badge-1';
    if (label === 'style2' || label.includes('2') || label.includes('B')) return 'badge-2';
    return 'badge-3';
  }

  function getBadgeText(ex) {
    const label = getLabel(ex);
    if (label === 'style1' || label.includes('1') || label.includes('A')) return 'S1';
    if (label === 'style2' || label.includes('2') || label.includes('B')) return 'S2';
    return 'S3';
  }

  function renderTable() {
    const tbody = document.getElementById('table-body');
    document.getElementById('total-count').textContent = examples.length;

    if (examples.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><p class="mono">NO EXAMPLES YET</p><p style="font-size:0.82rem;">กลับไป generate แล้วกด Save บน version ที่ชอบ</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = examples.map((ex, i) => {
      const isUsed = i >= examples.length - 3;
      const badgeClass = getBadgeClass(ex);
      const badgeText = getBadgeText(ex);
      const displayLabel = getLabel(ex);
      return `
        <tr>
          <td class="td-date">${formatDate(ex.date)}${isUsed ? '<span class="active-badge">★ ACTIVE</span>' : ''}</td>
          <td class="td-version"><span class="version-badge ${badgeClass}">${badgeText}</span></td>
          <td class="td-draft">
            <div class="preview-text">${escapeHtml(ex.draft)}</div>
            ${ex.context ? `<div style="margin-top:4px;font-size:0.72rem;color:var(--text-muted);">ctx: ${escapeHtml(truncate(ex.context, 60))}</div>` : ''}
            ${ex.twist ? `<div style="margin-top:4px;font-size:0.7rem;color:var(--text-muted);font-style:italic;">twist: ${escapeHtml(truncate(ex.twist, 60))}</div>` : ''}
          </td>
          <td class="td-content">
            <div class="preview-text" style="cursor:pointer;" onclick='showModal(${JSON.stringify(displayLabel)}, ${JSON.stringify(ex.content)})'>${escapeHtml(ex.content)}</div>
          </td>
          <td>
            <button class="btn-delete" onclick="deleteExample('${ex.id}')">Delete</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadExamples() {
    try {
      const r = await fetch('/api/examples');
      examples = await r.json();
      renderTable();
    } catch {
      showToast('โหลดข้อมูลไม่สำเร็จ', 3000);
    }
  }

  async function deleteExample(id) {
    if (!confirm('Delete this example?')) return;
    try {
      const r = await fetch('/api/examples/' + id, { method: 'DELETE' });
      if (!r.ok) throw new Error();
      examples = examples.filter(e => e.id !== id);
      renderTable();
      showToast('Deleted');
    } catch {
      showToast('Delete failed', 3000);
    }
  }

  function showModal(title, content) {
    document.getElementById('modal-title').textContent = title.toUpperCase();
    document.getElementById('modal-body').textContent = content;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal')) {
      document.getElementById('modal').classList.remove('open');
    }
  }

  loadExamples();
</script>
</body>
</html>
