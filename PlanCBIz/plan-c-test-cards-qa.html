  simple:"เฟส 3 คืออนาคต: แบรนด์จ่ายเงินเพื่อเข้าถึงครีเอเตอร์ที่ผ่านการคัด + ข้อมูลเรทจริงที่แบรนด์เองก็ไม่มี แต่ของแบบนี้ขายได้ก็ต่อเมื่อข้อมูลเรามากพอที่จะมีความหมาย — คำถามคือ \"มากพอ\" คือกี่ดีล",
  why:"กันตัวเองไม่ให้เปิดเฟส 3 เร็วเกินไปตอนข้อมูลยังบาง (ขายไม่ได้ แถมเสียเครดิต) และกันไม่ให้ลืมมันไปเลย — พอถึงเลขนี้ = สัญญาณว่าได้เวลากลับมาคิด",
  what:"ทุกดีลของสมาชิกที่มี debrief คือข้อมูลสะสมเข้ากองนี้อัตโนมัติ — ตัวเลขนี้แค่บอกว่าเมื่อไหร่กองมันโตพอ",
  tagtype:"prop", tagtext:"ผมเสนอ 30 ดีล — คุณเคาะ",
  opts:[
    ["30 ดีล","ตามที่เสนอ — พอเห็นแพทเทิร์นเรทต่อหมวด/ต่อขนาดฟอล"],
    ["15 ดีลก็เริ่มคิดได้แล้ว","เริ่มคุยกับแบรนด์ที่สนิทก่อนได้ ไม่ต้องรอข้อมูลสมบูรณ์"],
    ["50 ดีลขึ้นไป","เรื่องขายข้อมูลต้องแน่นจริงเท่านั้น เครดิตมีครั้งเดียว"],
    ["ยังไม่คิดเรื่องเฟส 3 เลยตอนนี้","โฟกัสเฟส 1–2 อย่างเดียว"]
  ]
}
];

let cur = 0;
const answers = Q.map(()=>({choice:null, note:""}));

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function render(){
  const stage = document.getElementById('stage');
  if (cur < Q.length) {
    const q = Q[cur], a = answers[cur];
    stage.innerHTML = `
      <div class="kicker">${q.kicker}</div>
      <h2>${q.title} <span class="tag ${q.tagtype}">${q.tagtext}</span></h2>
      <div class="box simple"><div class="h">พูดง่ายๆ คือ</div><p>${q.simple}</p></div>
      <div class="box why"><div class="h">ทำไมต้องตอบข้อนี้</div><p>${q.why}</p></div>
      <div class="box what"><div class="h">ตอบแล้วเกิดอะไร</div><p>${q.what}</p></div>
      <div class="qlabel">เลือกคำตอบ</div>
      ${q.opts.map((o,i)=>`
        <div class="opt ${a.choice===i?'sel':''}" data-choose="${i}">
          <div class="radio"></div>
          <div><div class="lab">${o[0]}</div><div class="sub">${o[1]}</div></div>
        </div>`).join('')}
      <div class="qlabel">โน้ตเพิ่ม (ไม่บังคับ)</div>
      <textarea id="note" placeholder="เช่น อยากปรับตัวเลข / เงื่อนไขเพิ่ม / คำถามกลับ">${esc(a.note)}</textarea>
      <div class="navrow">
        ${cur>0?'<button class="btn-ghost" data-nav="-1">← ก่อนหน้า</button>':''}
        <button class="btn-main" data-nav="1">${cur===Q.length-1?'ดูสรุป →':'ข้อถัดไป →'}</button>
      </div>`;
  } else {
    stage.innerHTML = `
      <div class="kicker">สรุป</div>
      <h2>คำตอบทั้งหมด</h2>
      ${Q.map((q,i)=>{
        const a = answers[i];
        return `<div class="sum-item">
          <div class="q">${q.kicker.replace(/·.*$/,'')} — ${q.title}</div>
          <div class="a ${a.choice===null?'none':''}">${a.choice===null?'ยังไม่ได้ตอบ':q.opts[a.choice][0]}</div>
          ${a.note?`<div class="n">โน้ต: ${esc(a.note)}</div>`:''}
        </div>`;
      }).join('')}
      <div class="navrow">
        <button class="btn-ghost" data-nav="-1">← กลับไปแก้</button>
        <button class="btn-main" data-act="export">ดาวน์โหลดคำตอบ (.md)</button>
      </div>
      <textarea id="mdout" readonly></textarea>`;
  }
  updateTop();
  window.scrollTo({top:0});
}

function updateTop(){
  const done = answers.filter(a=>a.choice!==null).length;
  document.getElementById('prog').textContent = `ตอบแล้ว ${done}/${Q.length}`;
  document.getElementById('toc').innerHTML = Q.map((q,i)=>
    `<div class="dot ${answers[i].choice!==null?'done':''} ${i===cur?'cur':''}" data-jump="${i}">${i+1}</div>`).join('');
}

function choose(i){
  answers[cur].choice = i;
  document.querySelectorAll('#stage [data-choose]').forEach(el=>{
    el.classList.toggle('sel', Number(el.dataset.choose)===i);
  });
  updateTop();
}

function saveNote(){
  const n = document.getElementById('note');
  if (n) answers[cur].note = n.value;
}

function buildMd(){
  let md = `# Plan C — คำตอบชุดการทดลอง (Test Cards)\n\n`;
  Q.forEach((q,i)=>{
    const a = answers[i];
    md += `## ${i+1}. ${q.title}\n`;
    md += `- คำตอบ: ${a.choice===null?'(ยังไม่ได้ตอบ)':q.opts[a.choice][0]}\n`;
    if (a.note) md += `- โน้ต: ${a.note}\n`;
    md += `\n`;
  });
  return md;
}

document.getElementById('stage').addEventListener('click', e=>{
  const c = e.target.closest('[data-choose]');
  if (c) { choose(Number(c.dataset.choose)); return; }
  const n = e.target.closest('[data-nav]');
  if (n) { saveNote(); cur = Math.min(Q.length, Math.max(0, cur + Number(n.dataset.nav))); render(); return; }
  const x = e.target.closest('[data-act="export"]');
  if (x) {
    const md = buildMd();
    try {
      const blob = new Blob([md], {type:'text/markdown'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'planc-testcards-answers.md';
      a.click();
    } catch(err){}
    const out = document.getElementById('mdout');
    out.style.display = 'block';
    out.value = md;
    return;
  }
});

document.querySelector('.top').addEventListener('click', e=>{
  const d = e.target.closest('[data-jump]');
  if (d) { saveNote(); cur = Number(d.dataset.jump); render(); }
});

render();
</script>
</body>
</html>
